<!doctype html>
<html data-theme="dark" lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>设置 — DSH GUI</title>
  <style>
    :root { color-scheme: dark; }
    [data-theme="light"] { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 10px 20px 12px;
      background: #0f151d;
      color: #e6edf3;
      font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      font-size: 13px;
      overflow-y: auto;
    }
    [data-theme="light"] body { background: #ffffff; color: #1f2328; }
    h1 { font-size: 15px; font-weight: 600; margin: 0 0 2px; }
    .sub { color: #5c6b7a; font-size: 12px; margin: 0 0 8px; }
    [data-theme="light"] .sub { color: #9aa0a6; }
    /* 三行两列：左列（关闭窗口 / 数据目录 / 引擎更新）从上到下排，右列
       （第三方插件）纵贯三行 —— 语言/外观/会话已移除，设置收敛到引擎页面。 */
    main.colgrid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      grid-template-areas:
        "close plugins"
        "datadir plugins"
        "engine plugins";
      gap: 6px 20px;
      align-items: start;
      margin-top: 8px;
    }
    section.g-close { grid-area: close; }
    section.g-datadir { grid-area: datadir; }
    section.g-engine { grid-area: engine; }
    section.g-plugins { grid-area: plugins; }
    section { min-width: 0; }
    h2 {
      font-size: 12px;
      font-weight: 600;
      color: #4d9fff;
      margin: 0 0 4px;
      padding-bottom: 3px;
      border-bottom: 1px solid #1b2632;
    }
    [data-theme="light"] h2 { color: #4d6bfe; border-bottom-color: #eaeef2; }
    .optrow {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      column-gap: 10px;
      row-gap: 2px;
      margin: 1px 0 3px;
    }
    .optrow label {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      line-height: 19px;
    }
    .optrow input { margin: 0; accent-color: #4d6bfe; cursor: pointer; }
    .stack label { display: flex; align-items: flex-start; gap: 7px; cursor: pointer; margin: 2px 0; }
    .stack input { margin: 2px 0 0; accent-color: #4d6bfe; cursor: pointer; flex: none; }
    .hint {
      color: #7a8ea0;
      font-size: 11px;
      line-height: 14px;
      display: block;
      margin: 0 0 5px;
    }
    [data-theme="light"] .hint { color: #9aa0a6; }
    /* 第三方插件行：标题成行、描述只占一行（全文在悬停提示里）、状态更紧凑。 */
    #pluginList .plg-title { font-weight: 600; }
    #pluginList .plg-desc {
      margin: 0 0 1px;
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    #pluginList .plg-row { margin: 6px 0 2px; padding-bottom: 4px; }
    /* 只在该插件确实带页面半边时出现的小标签：通用规则写在段落说明里，避免每行重复一句。 */
    #pluginList .plg-tag {
      display: inline-block;
      margin-left: 5px;
      padding: 0 5px;
      border-radius: 6px;
      border: 1px solid rgba(77, 159, 255, 0.45);
      color: #4d9fff;
      font-size: 10px;
      line-height: 14px;
      white-space: nowrap;
      vertical-align: 1px;
    }
    #checkRow { display: flex; align-items: center; gap: 10px; margin-top: 3px; flex-wrap: wrap; }
    button.dsh-btn {
      font: inherit;
      font-size: 12px;
      padding: 3px 12px;
      border-radius: 6px;
      border: 1px solid #31415a;
      background: transparent;
      color: inherit;
      cursor: pointer;
      white-space: nowrap;
    }
    [data-theme="light"] button.dsh-btn { border-color: #d0d7de; }
    button.dsh-btn:disabled { opacity: 0.6; cursor: default; }
    /* 插件有实际变动时的「需重启引擎」提示：高亮重启按钮（不改布局尺寸）。
       持续脉冲（而不是只播两次）——标注要一直醒目到用户真的重启为止。 */
    button.dsh-btn.attn {
      border-color: #4d9fff;
      color: #4d9fff;
      animation: attnPulse 1.2s ease-in-out infinite;
    }
    [data-theme="light"] button.dsh-btn.attn { border-color: #2b6fd6; color: #2b6fd6; }
    @keyframes attnPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(77, 159, 255, 0); }
      50% { box-shadow: 0 0 0 3px rgba(77, 159, 255, 0.35); }
    }
    @media (prefers-reduced-motion: reduce) {
      button.dsh-btn.attn { animation: none; }
    }
    /* 「待重启引擎」标注：常驻，直到引擎真的重启过。 */
    .plg-need-restart {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 1px 8px;
      border-radius: 999px;
      border: 1px solid rgba(232, 185, 107, 0.55);
      background: rgba(232, 185, 107, 0.12);
      color: #e8b96b;
      font-size: 11px;
      line-height: 16px;
      white-space: nowrap;
    }
    .plg-need-restart[hidden] { display: none; }
    .plg-need-restart::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #e8b96b;
      animation: needRestartDot 1.6s ease-in-out infinite;
    }
    @keyframes needRestartDot {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .plg-need-restart::before { animation: none; opacity: 1; }
    }
    #curEngine { font-size: 12px; opacity: 0.8; }
    #saved { color: #4d9fff; font-size: 12px; min-height: 14px; margin-top: 2px; text-align: right; }
    /* 安装/卸载进行中的进度条：不确定态转圈 + 阶段文字。 */
    #pluginProgress {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 5px;
      font-size: 12px;
      color: #4d9fff;
    }
    #pluginProgress[hidden] { display: none; }
    .progress-track {
      position: relative;
      flex: 1;
      height: 5px;
      min-width: 80px;
      border-radius: 3px;
      overflow: hidden;
      background: rgba(77, 107, 254, 0.15);
    }
    .progress-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 40%;
      border-radius: 3px;
      background: linear-gradient(90deg, #4d6bfe, #4d9fff);
      animation: progressSlide 1.1s ease-in-out infinite;
    }
    @keyframes progressSlide {
      0% { left: -40%; }
      100% { left: 100%; }
    }
    @media (prefers-reduced-motion: reduce) {
      .progress-bar { animation: none; left: 0; width: 100%; opacity: 0.5; }
    }
  </style>
</head>
<body>
  <h1 data-i18n="settings.title"></h1>
  <p class="sub" data-i18n="settings.autoSave"></p>

  <main class="colgrid">
    <section class="g-close">
      <h2 data-i18n="settings.close"></h2>
      <div class="optrow">
        <label><input name="closeAction" type="radio" value="tray" /><span data-i18n="settings.close.tray"></span></label>
        <label><input name="closeAction" type="radio" value="quit" /><span data-i18n="settings.close.quit"></span></label>
      </div>
    </section>

    <section class="g-datadir">
      <h2 data-i18n="settings.dataDir"></h2>
      <div class="stack">
        <label>
          <input name="homeMode" type="radio" value="system" />
          <span>
            <span data-i18n="settings.home.system"></span><br />
            <span class="hint" style="margin:0;" data-i18n="settings.home.moveHint"></span>
          </span>
        </label>
        <label>
          <input name="homeMode" type="radio" value="app" />
          <span>
            <span data-i18n="settings.home.app"></span><br />
            <span class="hint" style="margin:0;" data-i18n="settings.home.moveHint"></span>
          </span>
        </label>
      </div>
    </section>

    <section class="g-engine">
      <h2 data-i18n="settings.engineUpdate"></h2>
      <div class="sub" style="margin-bottom:6px;" data-i18n="settings.engineUpdate.sub"></div>
      <div class="optrow">
        <span style="opacity:0.75;margin-right:2px;" data-i18n="settings.update.policy"></span>
        <label><input name="updatePolicy" type="radio" value="auto" /><span data-i18n="settings.update.policy.auto"></span></label>
        <label><input name="updatePolicy" type="radio" value="ask" /><span data-i18n="settings.update.policy.ask"></span></label>
        <label><input name="updatePolicy" type="radio" value="notify" /><span data-i18n="settings.update.policy.notify"></span></label>
      </div>
      <div class="optrow">
        <span style="opacity:0.75;margin-right:2px;" data-i18n="settings.update.channel"></span>
        <label><input name="updateChannel" type="radio" value="npm" /><span data-i18n="settings.update.channel.npm"></span></label>
        <label><input name="updateChannel" type="radio" value="rc" /><span data-i18n="settings.update.channel.rc"></span></label>
        <label><input name="updateChannel" type="radio" value="all" /><span data-i18n="settings.update.channel.all"></span></label>
      </div>
      <div class="stack" style="margin-top:2px;">
        <label>
          <input id="updateAutoCheck" type="checkbox" />
          <span>
            <span data-i18n="settings.update.autoCheck"></span><br />
            <span class="hint" style="margin:0;" data-i18n="settings.update.autoCheck.hint"></span>
          </span>
        </label>
      </div>
      <div id="checkRow">
        <button id="btnCheckUpdate" type="button" class="dsh-btn">
          <span data-i18n="settings.update.checkNow"></span>
        </button>
        <span id="curEngine"></span>
      </div>
    </section>

    <section class="g-plugins">
      <h2 data-i18n="settings.plugins"></h2>
      <div class="sub" style="margin-bottom:6px;" data-i18n="settings.plugins.sub"></div>
      <div id="pluginList"></div>
      <div id="pluginProgress" hidden>
        <span class="progress-track"><span class="progress-bar"></span></span>
        <span id="pluginProgressText">…</span>
      </div>
      <div style="display:flex;align-items:center;gap:10px;margin-top:4px;flex-wrap:wrap;">
        <button id="btnSyncPlugins" type="button" class="dsh-btn">
          <span data-i18n="settings.plugins.sync"></span>
        </button>
        <button id="btnRestartEngine" type="button" class="dsh-btn">
          <span data-i18n="settings.plugins.restart"></span>
        </button>
        <!-- 安装/卸载（改 bundle 列表）后必须重启引擎才生效：按钮旁给一个持续可见的
             「待重启」标注，引擎真的重启过之后自动消失（见 markRestartNeeded）。 -->
        <span id="restartBadge" class="plg-need-restart" hidden data-i18n="settings.plugins.needRestartBadge"></span>
        <button id="btnReloadPage" type="button" class="dsh-btn attn" hidden>
          <span data-i18n="settings.plugins.reloadPage"></span>
        </button>
        <span id="pluginMsg" style="font-size:12px;opacity:0.85;"></span>
      </div>
      <span class="hint" data-i18n="settings.plugins.restartHint"></span>
    </section>
  </main>

  <div id="saved"></div>

  <script>
    const api = window.dshSettings;

    // 与主进程 UI_STRINGS 保持一致的界面文案（设置窗口专用键）。
    const I18N = {
      zh: {

        "settings.update.channel.rc": "跳过 alpha（rc/正式版最高）",
        "settings.update.channel.all": "最新版（含 alpha/beta/rc 预发布）",
        "settings.update.autoCheck": "自动检查引擎更新",
        "settings.update.autoCheck.hint": "启动时与运行中每 30 分钟检查一次；关闭后不查询 registry，直接用本地引擎",
        "settings.update.checkNow": "立即检查引擎更新",
        "settings.plugins": "第三方插件（勾选即安装，取消即卸载）",
        "settings.plugins.sub": "两个独立状态，与 Harness 页面的插件市场实时双向同步：①「安装」勾选框镜像安装/卸载；②「启用」开关镜像加载/禁用（关掉不卸载）。生效方式：安装/卸载需重启引擎（bundle 列表只在启动时组装），启用/禁用即时生效（引擎热重载补丁层），带页面半边的插件另需刷新页面——该差异标注在对应行上。第三方插件以你的权限运行第三方代码，默认关闭，勾选前请自行审阅源码。",
        "settings.plugins.installLabel": "安装",
        "settings.plugins.enableLabel": "启用",
        "settings.plugins.enabled": "已启用",
        "settings.plugins.disabled": "已禁用",
        "settings.plugins.disabledByMarket": "已禁用（插件市场）",
        "settings.plugins.disabledByPatch": "已禁用（profile 补丁层）",
        "settings.plugins.driftHint": "插件市场已禁用，但禁用尚未写入 profile 补丁层——引擎重启后由「修复 / 重试」补写，届时才真正不加载。",
        "settings.plugins.enableDone": "已启用 —— 引擎热重载后生效。",
        "settings.plugins.disableDone": "已禁用 —— 引擎热重载后生效（文件仍保留）。",
        "settings.plugins.needRefresh": "已生效（引擎侧）。插件页面部分需刷新 Harness 页面才同步 —— 点「刷新页面」。",
        "settings.plugins.needRestart": "已生效（已写入 profile）。需重启引擎后完全生效。",
        "settings.plugins.reloadPage": "刷新页面",
        "settings.plugins.notInstalledEnable": "未安装，无法启用",
        "settings.plugins.sync": "修复 / 重试",
        "settings.plugins.syncing": "修复中…",
        "settings.plugins.installed": "已安装 v{0}",
        "settings.plugins.notInstalled": "未安装（勾选即装）",
        "settings.plugins.done": "完成：新装 {0}，卸载 {1}，失败 {2}",
        "settings.plugins.failed": "失败：{0}",
        "settings.plugins.restart": "重启引擎使生效",
        "settings.plugins.restarting": "正在重启引擎…",
        "settings.plugins.restartHint": "安装/卸载后用上面的按钮重启引擎（不要用 dsh 页面里的重启，那只对页面自身生效）。",
        "settings.plugins.needRestartBadge": "待重启引擎",
        "settings.saved": "已保存",
      },
      en: {
        "settings.title": "Settings",
        "settings.autoSave": "DSH GUI — changes are saved automatically",
        "settings.dataDir": "Data Folder",
        "settings.home.system": "Follow system ~/.dsh (default)",
        "settings.home.app": "App folder (settings / sessions / workspace records travel with the app)",
        "settings.home.moveHint": "If the source folder holds data you will be asked whether to move it",
        "settings.close": "Close Window",
        "settings.close.tray": "Hide to tray (default; restore from tray)",
        "settings.close.quit": "Quit (closing the window quits and removes the tray)",
        "settings.engineUpdate": "Engine (dsh) Updates",
        "settings.engineUpdate.sub": "DSH GUI manages automatic engine (dsh) updates: update policy / version channel / auto-check. The check interval is fixed at 30 minutes; on a new version it installs silently, asks, or notifies per the policy.",
        "settings.update.policy": "Update Policy",
        "settings.update.policy.auto": "Silently update (always use the latest)",
        "settings.update.policy.ask": "Ask before updating (default)",
        "settings.update.policy.notify": "Notify only, do not auto-update",
        "settings.update.channel": "Version Channel",
        "settings.update.channel.npm": "Follow the npm latest tag",
        "settings.update.channel.rc": "Skip alpha (highest rc/stable)",
        "settings.update.channel.all": "Latest (incl. alpha/beta/rc prereleases)",
        "settings.update.autoCheck": "Auto-check for engine updates",
        "settings.update.autoCheck.hint": "Check at launch and every 30 minutes while running; when off, the registry is not queried and the local engine is used",
        "settings.update.checkNow": "Check Engine Update Now",
        "settings.plugins": "Third-party plugins (check = install, uncheck = uninstall)",
        "settings.plugins.sub": "Two independent states, in two-way live sync with the Harness plugin market: (1) the “install” checkbox mirrors install/uninstall; (2) the “enable” toggle mirrors loaded/disabled (off does not uninstall). How each applies: install/uninstall needs an engine restart (the bundle list is assembled only at boot); enable/disable applies immediately (the engine hot-reloads the patch layer); a plugin with a page half also needs a page reload — that difference is tagged on its row. Third-party plugins run third-party code with your permissions — off by default; review their source before enabling.",
        "settings.plugins.installLabel": "Install",
        "settings.plugins.enableLabel": "Enabled",
        "settings.plugins.enabled": "Enabled",
        "settings.plugins.disabled": "Disabled",
        "settings.plugins.disabledByMarket": "Disabled (plugin market)",
        "settings.plugins.disabledByPatch": "Disabled (profile patch layer)",
        "settings.plugins.driftHint": "Disabled in the plugin market, but the disable has not been written to the profile patch layer yet — “Repair / retry” writes it, and only then does the engine really stop loading it.",
        "settings.plugins.enableDone": "Enabled — applies after the engine hot-reloads.",
        "settings.plugins.disableDone": "Disabled — applies after the engine hot-reloads (files kept).",
        "settings.plugins.needRefresh": "Applied on the engine side. The plugin's page half needs a Harness page reload to match — click “Reload page”.",
        "settings.plugins.needRestart": "Written to the profile. Restart the engine for it to fully apply.",
        "settings.plugins.reloadPage": "Reload page",
        "settings.plugins.notInstalledEnable": "Not installed — cannot enable",
        "settings.plugins.sync": "Repair / retry",
        "settings.plugins.syncing": "Repairing…",
        "settings.plugins.installed": "Installed v{0}",
        "settings.plugins.notInstalled": "Not installed (check to install)",
        "settings.plugins.done": "Done: {0} installed, {1} removed, {2} failed",
        "settings.plugins.failed": "Failed: {0}",
        "settings.plugins.restart": "Restart engine to apply",
        "settings.plugins.restarting": "Restarting engine…",
        "settings.plugins.restartHint": "After install/uninstall, restart the engine with the button above (the in-page dsh restart only affects the page itself).",
        "settings.plugins.needRestartBadge": "restart engine",
        "settings.saved": "Saved",
      },
    };

    // uiLang 优先来自主进程推送（跟随系统时由主进程解析），查询参数兜底。
    let uiLang = new URLSearchParams(location.search).get("lang") === "en" ? "en" : "zh";

    function applyTexts() {
      const table = I18N[uiLang] || I18N.zh;
      document.querySelectorAll("[data-i18n]").forEach((el) => {
        const key = el.getAttribute("data-i18n");
        if (table[key] !== undefined) el.textContent = table[key];
      });
      document.documentElement.lang = uiLang === "en" ? "en" : "zh-CN";
      document.title = uiLang === "en" ? "Settings — DSH GUI" : "设置 — DSH GUI";
    }

    // ---- 第三方插件列表（数据来自主进程 payload） ----
    function esc(str) {
      return String(str ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
    /** 属性值转义（在 esc 之外还要处理引号，否则描述里的引号会截断属性）。 */
    function escAttr(str) {
      return esc(str).replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function stateText(id, s) {
      const st = (s.pluginStatus || {})[id];
      if (st && st.installed) return (uiLang === "en" ? "Installed v" : "已安装 v") + (st.version || "?");
      return uiLang === "en" ? "Not installed" : "未安装";
    }
    /** 启用/禁用状态文案（含来源：市场 / profile 补丁层）。 */
    function enabledText(st) {
      if (!st || !st.installed) return uiLang === "en" ? "Not installed — cannot enable" : "未安装，无法启用";
      if (st.enabled) return uiLang === "en" ? "Enabled" : "已启用";
      if (st.disabledBy === "patch")
        return uiLang === "en" ? "Disabled (profile patch layer)" : "已禁用（profile 补丁层）";
      return uiLang === "en" ? "Disabled (plugin market)" : "已禁用（插件市场）";
    }

    // ---- 「待重启引擎」标注 ----------------------------------------------------
    // 哪些操作需要重启引擎（按引擎实现）：**安装 / 卸载**改的是 profile 的 bundle 列表，
    // 引擎只在启动时 compose 它，所以必须重启；**启用 / 禁用**写的是补丁层，由引擎 live
    // 热重载即时生效，不需要重启（含页面半边的插件另需刷新页面，走「刷新页面」按钮）。
    //
    // 标注是**常驻**的（按钮持续脉冲 + 旁边一枚「待重启引擎」小标签），直到引擎真的重启过：
    // 既在点击重启按钮时清除，也在 paint() 里观察到 engineRunning 由 false 变 true 时清除
    // （用户从托盘/重开应用重启也算）。这样不会出现「提示一闪而过、用户没看见」的情况。
    let pendingEngineRestart = false;
    // 只有「先见过引擎在运行」之后观察到的 down 才算一次真正的重启——否则设置窗口
    // 先于引擎启动完成打开时（engineRunning:false）会被误判，引擎一就绪就把标注清掉。
    let sawEngineUp = false;
    let sawEngineDown = false;
    function markRestartNeeded(needed) {
      pendingEngineRestart = Boolean(needed);
      sawEngineDown = false; // 从这一刻起重新观察一次真正的重启
      const badge = document.getElementById("restartBadge");
      const btn = document.getElementById("btnRestartEngine");
      if (badge) badge.hidden = !pendingEngineRestart;
      if (btn) {
        if (pendingEngineRestart && !btn.disabled) btn.classList.add("attn");
        else btn.classList.remove("attn");
      }
    }
    /** 观察到引擎重启过（up → down → up）就撤掉标注。 */
    function settleRestartBadge(s) {
      if (!s) return;
      if (s.engineRunning === true) {
        if (pendingEngineRestart && sawEngineDown) markRestartNeeded(false);
        sawEngineUp = true;
        sawEngineDown = false;
        return;
      }
      // engineRunning !== true：只有在见过引擎运行之后，这才是一次「引擎停了」。
      if (sawEngineUp) sawEngineDown = true;
    }
    // 两个独立状态，各自镜像各自的真实状态、互不持久化“期望”集合：
    //   - 安装勾选框：装了即勾、没装即不勾 → 勾选立即安装 / 取消立即卸载；
    //   - 启用开关：启用即开、禁用即关 → 开启恢复加载 / 关闭只是不加载（不卸载）。
    // 两者都来自同一份 profile（bundles + 补丁层 + 市场 state.json），因此市场
    // 那边的改动会经 watch 广播回来重绘，这里改的也会写回同一份文件。
    // busy 期间（安装/卸载/启用/禁用/修复进行中）所有勾选框与操作按钮一并禁用，
    // 避免两个 pnpm 同时改同一个 profile 造成卡顿/锁冲突。
    function renderPlugins(s) {
      const box = document.getElementById("pluginList");
      if (!box) return;
      const catalog = Array.isArray(s.pluginCatalog) ? s.pluginCatalog : [];
      const status = s.pluginStatus || {};
      const busy = window.__pluginBusy === true;
      box.innerHTML = catalog
        .map((entry) => {
          const title = uiLang === "en" ? entry.en : entry.zh;
          const desc = uiLang === "en" ? entry.enDesc : entry.zhDesc;
          const blocked = entry.engineOk === false;
          const engineHint = blocked ? (uiLang === "en" ? entry.enEngine : entry.zhEngine) : "";
          const st = status[entry.id];
          const installed = Boolean(st && st.installed);
          const enabled = !st || st.enabled !== false;
          const state = blocked
            ? uiLang === "en"
              ? "Engine-incompatible — not available"
              : "与当前引擎不兼容，不可用"
            : stateText(entry.id, s);
          // 市场已禁用、但补丁层还没落下 → 引擎仍会加载它（两端不一致）。
          const drift = Boolean(st && st.installed && st.marketDisabled && !st.patchDisabled);
          // 启用开关：只在已安装时出现（没装就无所谓启用）。
          // 注意必须放在安装 <label> **外面**：HTML 里 label 会把它内部第一个
          // 可标注控件当成自己的目标，把启用勾选框嵌进去会让「点启用」顺带切换
          // 安装勾选框（= 意外卸载）。所以启用开关是 .plg-row 的兄弟节点。
          const enableRow = installed
            ? '<label class="plg-enable-label" style="display:inline-flex;gap:5px;align-items:center;margin:2px 0 0 24px;cursor:' +
              (busy ? "not-allowed" : "pointer") +
              ';">' +
              '<input type="checkbox" class="plg-enable" data-id="' + escAttr(entry.id) + '" ' + (enabled ? "checked" : "") +
              (busy ? " disabled" : "") +
              ' style="accent-color:#4d9fff;" />' +
              '<span class="hint" style="margin:0;">' +
              esc(uiLang === "en" ? "Enabled" : "启用") +
              "</span></label>"
            : "";
          return (
            '<div class="plg-row">' +
            '<label class="plg" style="display:flex;gap:7px;align-items:flex-start;cursor:' + (blocked ? "not-allowed" : "pointer") + ';">' +
            '<input type="checkbox" class="plg-check" data-id="' + escAttr(entry.id) + '" ' + (installed ? "checked" : "") +
            (blocked || busy ? " disabled" : "") +
            ' style="margin-top:3px;accent-color:#4d6bfe;" />' +
            "<span>" +
            // 标题已经带上包名时（如「按键设置（dsh-keys-setting）」）不再重复追加一次，省一行宽度。
            '<span class="plg-title">' + esc(title) +
            (title.includes(entry.pkg) ? "" : " — <code style=\"opacity:.7\">" + esc(entry.pkg) + "</code>") +
            "</span><br/>" +
            // 描述只占一行（CSS clamp），全文放悬停提示，便于把窗口压小。
            '<span class="hint plg-desc" title="' + escAttr(desc) + '">' + esc(desc) + "</span>" +
            (blocked && engineHint
              ? '<span class="hint" style="margin:0;display:block;color:#e8806b;">⚠ ' + esc(engineHint) + "</span>"
              : "") +
            // 状态行：状态 + 仅针对该插件的能力标签。安装/卸载需重启、启用/禁用热重载这两条
            // 通用规则写在段落说明里（每行重复只会把窗口撑大），这里只标「含页面部分」这类
            // 因插件而异的事实（由主进程读 package.json 的 dsh.client 得出，见 pluginHasClientHalf）。
            '<span class="plg-state hint" style="margin:1px 0 0;display:block;color:' + (blocked ? "#e8806b" : "#4d9fff") + ';">' +
            esc(state) +
            (installed
              ? ' · <span class="plg-enable-state" style="color:' + (enabled ? "#3fb950" : "#e8806b") + ';">' +
                esc(enabledText(st)) +
                "</span>"
              : "") +
            (st && st.client === true
              ? '<span class="plg-tag">' +
                esc(uiLang === "en" ? "page half · reload page" : "含页面部分 · 需刷新页面") +
                "</span>"
              : "") +
            "</span>" +
            (drift
              ? '<span class="hint" style="margin:0;display:block;color:#e8b96b;">⚠ ' +
                esc(
                  uiLang === "en"
                    ? "Disabled in the plugin market, but the disable has not been written to the profile patch layer yet — “Repair / retry” writes it, and only then does the engine really stop loading it."
                    : "插件市场已禁用，但禁用尚未写入 profile 补丁层——引擎重启后由「修复 / 重试」补写，届时才真正不加载。",
                ) +
                "</span>"
              : "") +
            "</span></label>" +
            enableRow +
            "</div>"
          );
        })
        .join("");
    }

    // ---- 安装/卸载/修复 进度条 ----
    function progressEl() {
      return document.getElementById("pluginProgress");
    }
    function progressTextEl() {
      return document.getElementById("pluginProgressText");
    }
    /** 主进程逐阶段日志 → 友好文案；不认识的原始行保持上一次文案不覆盖。 */
    function friendlyProgress(text) {
      const t = String(text || "");
      if (/installing\s|dsh plugin --profile web add|plugin install failed/.test(t))
        return uiLang === "en" ? "Installing…" : "正在安装…";
      if (/removing\s|dsh plugin --profile web remove|plugin removed:/.test(t))
        return uiLang === "en" ? "Uninstalling…" : "正在卸载…";
      if (/install pnpm/.test(t)) return uiLang === "en" ? "Preparing pnpm…" : "正在准备 pnpm 环境…";
      if (/stage/i.test(t)) return uiLang === "en" ? "Preparing local bundle…" : "正在准备本地捆绑…";
      return null;
    }
    /** busy 锁：一次只允许一个插件操作；进行中显示进度条并禁用全部操作。 */
    function setPluginBusy(busy, headerText) {
      window.__pluginBusy = Boolean(busy);
      const prog = progressEl();
      if (prog) {
        prog.hidden = !window.__pluginBusy;
        if (headerText) progressTextEl().textContent = headerText;
      }
      const list = document.getElementById("pluginList");
      const syncBtn = document.getElementById("btnSyncPlugins");
      const restartBtn = document.getElementById("btnRestartEngine");
      const reloadBtn = document.getElementById("btnReloadPage");
      if (window.__pluginBusy) {
        if (list) list.querySelectorAll(".plg-check, .plg-enable").forEach((b) => { b.disabled = true; });
        if (syncBtn) { window.__syncWasDisabled = syncBtn.disabled; syncBtn.disabled = true; }
        if (restartBtn) { window.__restartWasDisabled = restartBtn.disabled; restartBtn.disabled = true; }
        if (reloadBtn) { window.__reloadWasDisabled = reloadBtn.disabled; reloadBtn.disabled = true; }
      } else {
        // 恢复各按钮进入 busy 前的可用状态（勾选框由 paint 按新状态重绘）。
        if (syncBtn) syncBtn.disabled = window.__syncWasDisabled === true;
        if (restartBtn) restartBtn.disabled = window.__restartWasDisabled === true;
        if (reloadBtn) reloadBtn.disabled = window.__reloadWasDisabled === true;
        // busy 期间按钮是禁用的，markRestartNeeded 那时加不上高亮；这里按当前状态补一次。
        markRestartNeeded(pendingEngineRestart);
      }
    }

    function paint(s) {
      if (s.uiLang === "zh" || s.uiLang === "en") uiLang = s.uiLang;
      applyTexts();
      document.querySelectorAll('input[name="homeMode"]').forEach((el) => { el.checked = el.value === s.dshHomeMode; });
      document.querySelectorAll('input[name="closeAction"]').forEach((el) => { el.checked = el.value === s.closeAction; });
      document.querySelectorAll('input[name="updatePolicy"]').forEach((el) => { el.checked = el.value === s.updatePolicy; });
      document.querySelectorAll('input[name="updateChannel"]').forEach((el) => { el.checked = el.value === s.updateChannel; });
      document.getElementById("updateAutoCheck").checked = s.updateCheckEnabled !== false;
      window.__lastPayload = s;
      window.__lastCatalog = Array.isArray(s.pluginCatalog) ? s.pluginCatalog : [];
      renderPlugins(s);
      const cur = document.getElementById("curEngine");
      const eng = s.installedEngine;
      const engTxt = eng
        ? (uiLang === "en" ? "Current engine v" + eng : "当前引擎 v" + eng)
        : uiLang === "en"
          ? "(engine not installed)"
          : "（引擎未安装）";
      if (cur && cur.textContent !== engTxt) cur.textContent = engTxt;
      // 引擎真的重启过就撤掉「待重启引擎」标注（无论用户是怎么重启的）。
      settleRestartBadge(s);
    }

    let flashTimer = null;
    function flashSaved() {
      const el = document.getElementById("saved");
      el.textContent = uiLang === "en" ? "Saved" : "已保存";
      clearTimeout(flashTimer);
      flashTimer = setTimeout(() => { el.textContent = ""; }, 1200);
    }

    api.onChanged(paint);

    // 主进程逐阶段推送安装/卸载进度（微调正在进行的文案）。
    api.onPluginProgress((p) => {
      const friendly = friendlyProgress(p && p.text);
      if (friendly) progressTextEl().textContent = friendly;
    });

    // 引擎页面/外观设置变更时实时切换本窗口深浅色（主进程 app:theme 推送）。
    api.onTheme((theme) => {
      if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
    });

    // 内容高度自适应：语言切换 / 数据到达 / 主题变化时通知主进程重设窗口高度。
    let rafPending = false;
    function reportHeight() {
      if (rafPending) return;
      rafPending = true;
      requestAnimationFrame(() => {
        rafPending = false;
        const h = Math.ceil(document.body.scrollHeight + 8);
        // api.autoSize 是 ipcRenderer.invoke（返回 Promise），try/catch 抓不到它的拒绝，
        // 必须挂 .catch —— 否则窗口在调用途中被销毁就是一条未处理的 rejection。
        api.autoSize(h).catch(() => {})
      });
    }
    if (typeof ResizeObserver === "function") {
      const ro = new ResizeObserver(() => reportHeight());
      ro.observe(document.body);
    }
    window.addEventListener("load", reportHeight);
    // theme 查询参数在脚本末尾设置，DOM 高度可能变化 → 由 ResizeObserver 兜底。

    api.get().then((s) => {
      paint(s);
      document.querySelectorAll('input[name="homeMode"]').forEach((el) => {
        el.addEventListener("change", () => {
          if (!el.checked) return;
          // 迁移确认框被取消时 main 不会保存（甚至原样返回）—— 那种情况下闪「已保存」是错的，
          // 而且单选框还停留在新值上，直到下一次 broadcast 才被改回去。
          api.set({ dshHomeMode: el.value }).then((res) => {
            if (res && res.applied === false) {
              if (s && s.dshHomeMode) {
                document.querySelectorAll('input[name="homeMode"]').forEach((other) => {
                  other.checked = other.value === s.dshHomeMode;
                });
              }
              return;
            }
            flashSaved();
          });
        });
      });
      document.querySelectorAll('input[name="closeAction"]').forEach((el) => {
        el.addEventListener("change", () => el.checked && api.set({ closeAction: el.value }).then(() => flashSaved()));
      });
      document.querySelectorAll('input[name="updatePolicy"]').forEach((el) => {
        el.addEventListener("change", () => el.checked && api.set({ updatePolicy: el.value }).then(() => flashSaved()));
      });
      document.querySelectorAll('input[name="updateChannel"]').forEach((el) => {
        el.addEventListener("change", () => el.checked && api.set({ updateChannel: el.value }).then(() => flashSaved()));
      });
      document.getElementById("updateAutoCheck").addEventListener("change", (e) => {
        api.set({ updateCheckEnabled: e.target.checked }).then(() => flashSaved());
      });

      // 第三方插件：勾选框 = 安装状态的实时镜像。勾选 → 立即安装，取消 → 立即
      // 卸载（引擎与插件市场都改同一个 profiles/web/package.json，状态变化会经
      // broadcast 推回来重绘，因此这里不用再写回任何“期望”集合）。
      //
      // 安装/卸载有真实耗时（pnpm/引擎子进程），期间：显示进度条 + 禁用全部
      // 勾选框与操作按钮（busy 锁），完成后恢复——避免无反馈的“卡窗口”观感，
      // 也避免两个操作并发改同一个 profile。
      const pluginList = document.getElementById("pluginList");
      const pluginMsg = document.getElementById("pluginMsg");
      const pluginLabel = (id) => {
        const entry = (window.__lastCatalog || []).find((c) => c.id === id);
        return entry ? (uiLang === "en" ? entry.en : entry.zh) : id;
      };
      pluginList.addEventListener("change", async (e) => {
        if (!e.target) return;
        // ---- 启用 / 禁用开关（不卸载，只切换引擎是否加载）----
        if (e.target.classList.contains("plg-enable")) {
          const id = e.target.getAttribute("data-id");
          const wantEnabled = e.target.checked;
          const label = pluginLabel(id);
          setPluginBusy(
            true,
            (wantEnabled ? (uiLang === "en" ? "Enabling " : "正在启用 ") : (uiLang === "en" ? "Disabling " : "正在禁用 ")) +
              label +
              "…",
          );
          pluginMsg.textContent = "";
          try {
            const res = await api.setPluginEnabled(id, wantEnabled);
            const fresh = await api.get().catch(() => null);
            if (fresh) paint(fresh);
            if (res && res.ok) {
              // 与市场开关一致的语义：引擎侧已在线生效；带客户端半体的插件还需要
              // 刷新 Harness 页面，页面里已加载的那半才会消失/出现（市场也是返回
              // refresh 并提示「刷新后生效」）。需要重启时则提示重启。
              const reloadBtn = document.getElementById("btnReloadPage");
              if (res.refresh) {
                pluginMsg.textContent = uiLang === "en"
                  ? "Applied on the engine side. The plugin's page half needs a Harness page reload to match — click “Reload page”."
                  : "已生效（引擎侧）。插件页面部分需刷新 Harness 页面才同步 —— 点「刷新页面」。";
                if (reloadBtn) reloadBtn.hidden = false;
              } else {
                pluginMsg.textContent = wantEnabled
                  ? (uiLang === "en" ? "Enabled." : "已启用。")
                  : (uiLang === "en" ? "Disabled." : "已禁用。");
                if (reloadBtn) reloadBtn.hidden = true;
              }
              if (res.restart) {
                pluginMsg.textContent = uiLang === "en"
                  ? "Written to the profile. Restart the engine for it to fully apply."
                  : "已写入 profile。需重启引擎后完全生效。";
                markRestartNeeded(true);
              }
            } else {
              pluginMsg.textContent =
                (uiLang === "en" ? "Failed: " : "失败：") + String((res && res.error) || "?");
            }
          } catch (error) {
            pluginMsg.textContent = (uiLang === "en" ? "Failed: " : "失败：") + String((error && error.message) || error);
            const fresh = await api.get().catch(() => null);
            if (fresh) paint(fresh);
          } finally {
            setPluginBusy(false);
            const freshFinal = await api.get().catch(() => window.__lastPayload || null);
            if (freshFinal) paint(freshFinal);
          }
          return;
        }
        // ---- 安装 / 卸载勾选框 ----
        if (!e.target.classList.contains("plg-check")) return;
        const id = e.target.getAttribute("data-id");
        const wantChecked = e.target.checked;
        const label = pluginLabel(id);
        const header =
          (wantChecked
            ? (uiLang === "en" ? "Installing " : "正在安装 ")
            : (uiLang === "en" ? "Uninstalling " : "正在卸载 ")) + label + "…";
        setPluginBusy(true, header);
        pluginMsg.textContent = "";
        try {
          const res = wantChecked ? await api.installPlugin(id) : await api.uninstallPlugin(id);
          const fresh = await api.get();
          paint(fresh);
          if (res && res.ok) {
            // 安装和卸载都改了 profile 的 bundle 列表 → 两者都需要重启引擎才挂载/消失。
            pluginMsg.textContent = wantChecked
              ? (uiLang === "en" ? "Installed — restart engine to apply." : "已安装 —— 重启引擎后生效。")
              : (uiLang === "en" ? "Uninstalled — restart engine to apply." : "已卸载 —— 重启引擎后生效。");
            markRestartNeeded(true);
          } else if (res && res.skipped) {
            pluginMsg.textContent =
              (uiLang === "en" ? "Engine-incompatible — not installed." : "与当前引擎不兼容，未安装。");
          } else {
            pluginMsg.textContent =
              (uiLang === "en" ? "Failed: " : "失败：") + String((res && res.error) || "?");
          }
        } catch (error) {
          pluginMsg.textContent = (uiLang === "en" ? "Failed: " : "失败：") + String((error && error.message) || error);
          const fresh = await api.get().catch(() => null);
          if (fresh) paint(fresh);
        } finally {
          // 恢复交互：解锁全部勾选框与操作按钮（按新状态重绘），隐藏进度条。
          setPluginBusy(false);
          const freshFinal = await api.get().catch(() => window.__lastPayload || null);
          if (freshFinal) paint(freshFinal);
        }
      });
      const btnSyncPlugins = document.getElementById("btnSyncPlugins");
      const syncLabel = btnSyncPlugins.querySelector("span");
      const btnRestartEngine = document.getElementById("btnRestartEngine");
      const restartLabel = btnRestartEngine.querySelector("span");
      // 「刷新页面」：与市场开关的 refresh 信号对应——引擎侧已经切换完成，但页面里
      // 已加载的客户端半体要重新加载页面才与之一致。
      const btnReloadPage = document.getElementById("btnReloadPage");
      if (btnReloadPage) {
        btnReloadPage.addEventListener("click", async () => {
          btnReloadPage.disabled = true;
          pluginMsg.textContent = uiLang === "en" ? "Reloading…" : "正在刷新…";
          try {
            const res = await api.reloadEngineWindow();
            if (res && res.ok === false) {
              pluginMsg.textContent =
                (uiLang === "en" ? "Reload unavailable: " : "刷新不可用：") + String(res.error || "?");
              btnReloadPage.disabled = false;
              return;
            }
            btnReloadPage.hidden = true;
            pluginMsg.textContent = uiLang === "en" ? "Page reloaded." : "页面已刷新。";
          } catch (error) {
            pluginMsg.textContent =
              (uiLang === "en" ? "Failed: " : "失败：") + String((error && error.message) || error);
          } finally {
            btnReloadPage.disabled = false;
          }
        });
      }
      btnRestartEngine.addEventListener("click", async () => {
        if (btnRestartEngine.disabled) return;
        btnRestartEngine.disabled = true;
        // 先记下「有待重启的改动」再清标注：重启失败时要把标注放回去，否则界面会假装
        // 什么都不用做，而那次「需重启才生效」的改动其实一直没落地。
        const wasPending = pendingEngineRestart;
        markRestartNeeded(false);
        const orig = restartLabel.textContent;
        restartLabel.textContent = uiLang === "en" ? "Restarting engine…" : "正在重启引擎…";
        pluginMsg.textContent = "";
        try {
          const res = await api.restartEngine();
          if (res && res.ok === false) {
            pluginMsg.textContent =
              (uiLang === "en" ? "Restart unavailable: " : "重启不可用：") + String(res.reason || "?");
            restartLabel.textContent = orig;
            btnRestartEngine.disabled = false;
            if (wasPending) markRestartNeeded(true); // 重启没发生：标注放回去
            return;
          }
          // 引擎重启中：稍后由 paint(engineRunning=false→true) 反映；按钮短暂保持禁用。
          setTimeout(() => {
            restartLabel.textContent = orig;
            btnRestartEngine.disabled = false;
          }, 2000);
        } catch (error) {
          pluginMsg.textContent = (uiLang === "en" ? "Failed: " : "失败：") + String((error && error.message) || error);
          restartLabel.textContent = orig;
          btnRestartEngine.disabled = false;
          if (wasPending) markRestartNeeded(true); // 重启没发生：标注放回去
        }
      });
      btnSyncPlugins.addEventListener("click", async () => {
        if (btnSyncPlugins.disabled) return;
        btnSyncPlugins.disabled = true;
        const orig = syncLabel.textContent;
        syncLabel.textContent = uiLang === "en" ? "Repairing…" : "修复中…";
        pluginMsg.textContent = "";
        markRestartNeeded(false);
        setPluginBusy(true, uiLang === "en" ? "Repairing plugins…" : "正在修复插件…");
        try {
          const res = await api.syncPlugins();
          const fresh = await api.get();
          paint(fresh);
          const failN = (res && Array.isArray(res.errors) ? res.errors.length : 0) || 0;
          const okN = (res && Array.isArray(res.installed) ? res.installed.length : 0) || 0;
          const remN = (res && Array.isArray(res.removed) ? res.removed.length : 0) || 0;
          const skipN = (res && Array.isArray(res.skipped) ? res.skipped.length : 0) || 0;
          // 安装/捆绑更新真的发生才提示重启引擎；否则明确告知无需重启。
          const changed = Boolean(res && res.changed) || okN + remN > 0;
          const msg = [];
          if (okN > 0) msg.push(uiLang === "en" ? okN + " installed" : "新装 " + okN);
          if (remN > 0) msg.push(uiLang === "en" ? remN + " uninstalled" : "卸载 " + remN);
          if (skipN > 0) msg.push(uiLang === "en" ? skipN + " skipped (engine-incompatible)" : "跳过 " + skipN + " 个引擎不兼容项");
          if (failN > 0) msg.push(uiLang === "en" ? failN + " failed" : "失败 " + failN);
          const head =
            msg.length > 0
              ? (uiLang === "en" ? "Done: " : "完成：") + msg.join(uiLang === "en" ? ", " : "，")
              : uiLang === "en"
                ? "Everything is in sync"
                : "插件状态一致";
          const tail = changed
            ? uiLang === "en"
              ? " — restart the engine to apply."
              : " —— 需重启引擎才能生效。"
            : uiLang === "en"
              ? " — no restart needed."
              : " —— 无需重启引擎。";
          pluginMsg.textContent = head + tail;
          if (failN > 0 && Array.isArray(res.errors) && res.errors[0]) {
            pluginMsg.textContent += (uiLang === "en" ? " First error: " : " 首个错误：") + String(res.errors[0]);
          }
          // 有实际变动（新装/卸载/捆绑更新）：标注「待重启引擎」；没有变动则撤掉旧标注。
          markRestartNeeded(changed);
        } catch (error) {
          pluginMsg.textContent = (uiLang === "en" ? "Failed: " : "失败：") + String((error && error.message) || error);
        } finally {
          setPluginBusy(false);
          const freshFinal = await api.get().catch(() => window.__lastPayload || null);
          if (freshFinal) paint(freshFinal);
          syncLabel.textContent = orig;
          btnSyncPlugins.disabled = false;
        }
      });
      const btnCheck = document.getElementById("btnCheckUpdate");
      const checkLabel = btnCheck.querySelector("span");
      btnCheck.addEventListener("click", async () => {
        if (btnCheck.disabled) return;
        btnCheck.disabled = true;
        const orig = checkLabel.textContent;
        checkLabel.textContent = uiLang === "en" ? "Checking…" : "检查中…";
        const restore = (text, delay) => {
          setTimeout(() => {
            checkLabel.textContent = text;
            btnCheck.disabled = false;
          }, delay);
        };
        try {
          const res = await api.checkUpdate();
          if (res && res.busy) {
            // 主进程已有检查在进行：提示后恢复按钮。
            checkLabel.textContent = uiLang === "en" ? "Check already in progress…" : "已有检查正在进行…";
            restore(orig, 1500);
            return;
          }
          if (res && res.installed) {
            const s2 = await api.get();
            paint(s2);
          }
          restore(orig, 800);
        } catch {
          restore(orig, 800);
        }
      });
    });

    // Follow the theme the host resolved from DeepSeek Harness settings.yaml.
    const theme = new URLSearchParams(location.search).get("theme");
    if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
  </script>
</body>
</html>
