<!doctype html>
<html data-theme="dark" lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>设置 — DSH Ready GUI</title>
  <style>
    :root { color-scheme: dark; }
    [data-theme="light"] { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 10px 20px 12px;
      background: #0f151d;
      color: #e6edf3;
      font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      font-size: 13px;
      overflow-y: auto;
    }
    [data-theme="light"] body { background: #ffffff; color: #1f2328; }
    h1 { font-size: 15px; font-weight: 600; margin: 0 0 2px; }
    .sub { color: #5c6b7a; font-size: 12px; margin: 0 0 8px; }
    [data-theme="light"] .sub { color: #9aa0a6; }
    /* 三行两列：左列（关闭窗口 / 数据目录 / 引擎更新）从上到下排，右列
       （第三方插件）纵贯三行 —— 语言/外观/会话已移除，设置收敛到引擎页面。 */
    main.colgrid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      grid-template-areas:
        "close plugins"
        "datadir plugins"
        "engine plugins";
      gap: 6px 20px;
      align-items: start;
      margin-top: 8px;
    }
    section.g-close { grid-area: close; }
    section.g-datadir { grid-area: datadir; }
    section.g-engine { grid-area: engine; }
    section.g-plugins { grid-area: plugins; }
    section { min-width: 0; }
    h2 {
      font-size: 12px;
      font-weight: 600;
      color: #4d9fff;
      margin: 0 0 4px;
      padding-bottom: 3px;
      border-bottom: 1px solid #1b2632;
    }
    [data-theme="light"] h2 { color: #4d6bfe; border-bottom-color: #eaeef2; }
    .optrow {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      column-gap: 10px;
      row-gap: 2px;
      margin: 1px 0 3px;
    }
    .optrow label {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      line-height: 19px;
    }
    .optrow input { margin: 0; accent-color: #4d6bfe; cursor: pointer; }
    .stack label { display: flex; align-items: flex-start; gap: 7px; cursor: pointer; margin: 2px 0; }
    .stack input { margin: 2px 0 0; accent-color: #4d6bfe; cursor: pointer; flex: none; }
    .hint {
      color: #7a8ea0;
      font-size: 11px;
      line-height: 14px;
      display: block;
      margin: 0 0 5px;
    }
    [data-theme="light"] .hint { color: #9aa0a6; }
    /* 第三方插件行：标题成行、描述只占一行（全文在悬停提示里）、状态更紧凑。 */
    #pluginList .plg-title { font-weight: 600; }
    #pluginList .plg-desc {
      margin: 0 0 1px;
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    #pluginList .plg-row { margin: 6px 0 2px; padding-bottom: 4px; }
    /* 只在该插件确实带页面半边时出现的小标签：通用规则写在段落说明里，避免每行重复一句。 */
    #pluginList .plg-tag {
      display: inline-block;
      margin-left: 5px;
      padding: 0 5px;
      border-radius: 6px;
      border: 1px solid rgba(77, 159, 255, 0.45);
      color: #4d9fff;
      font-size: 10px;
      line-height: 14px;
      white-space: nowrap;
      vertical-align: 1px;
    }
    #checkRow { display: flex; align-items: center; gap: 10px; margin-top: 3px; flex-wrap: wrap; }
    button.dsh-btn {
      font: inherit;
      font-size: 12px;
      padding: 3px 12px;
      border-radius: 6px;
      border: 1px solid #31415a;
      background: transparent;
      color: inherit;
      cursor: pointer;
      white-space: nowrap;
    }
    [data-theme="light"] button.dsh-btn { border-color: #d0d7de; }
    button.dsh-btn:disabled { opacity: 0.6; cursor: default; }
    /* 插件有实际变动时的「需重启引擎」提示：高亮重启按钮（不改布局尺寸）。
       持续脉冲（而不是只播两次）——标注要一直醒目到用户真的重启为止。 */
*/
    button.dsh-btn.attn {
      border-color: #4d9fff;
      color: #4d9fff;
      animation: attnPulse 1.2s ease-in-out infinite;
    }
    [data-theme="light"] button.dsh-btn.attn { border-color: #2b6fd6; color: #2b6fd6; }
    @keyframes attnPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(77, 159, 255, 0); }
      50% { box-shadow: 0 0 0 3px rgba(77, 159, 255, 0.35); }
    }
    @media (prefers-reduced-motion: reduce) {
      button.dsh-btn.attn { animation: none; }
    }
    /* 「待重启引擎」标注：常驻，直到引擎真的重启过。 */
    .plg-need-restart {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 1px 8px;
      border-radius: 999px;
      border: 1px solid rgba(232, 185, 107, 0.55);
      background: rgba(232, 185, 107, 0.12);
      color: #e8b96b;
      font-size: 11px;
      line-height: 16px;
      white-space: nowrap;
    }
    .plg-need-restart[hidden] { display: none; }
    .plg-need-restart::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #e8b96b;
      animation: needRestartDot 1.6s ease-in-out infinite;
    }
    @keyframes needRestartDot {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .plg-need-restart::before { animation: none; opacity: 1; }
    }
    /* 插件行里的三个结构类：以前它们只写在模板上、没有任何规则命中（样式全内联），
       等于「有名字但没作用」的死类。把其中**静态**的部分收到这里，内联只留随状态变化的
       颜色 / cursor。 */
    .plg-enable-label { display: inline-flex; gap: 5px; align-items: center; margin: 2px 0 0 24px; }
    .plg-state { margin: 1px 0 0; display: block; }
    .plg-enable-state { font-weight: 500; }
    /* 首次启动卡片：只在「还有该装没装的内置插件，且用户还没做过决定」时显示（见 renderFirstRun）。
       它在插件区最上方、用强调色描边 —— 随包插件默认全部关闭，这里是把四个修复一次做完的唯一入口。 */
    .first-run {
      border: 1px solid rgba(77, 107, 254, 0.5);
      background: rgba(77, 107, 254, 0.08);
      border-radius: 8px;
      padding: 9px 11px;
      margin: 0 0 9px;
    }
    [data-theme="light"] .first-run { background: rgba(77, 107, 254, 0.06); }
    .first-run[hidden] { display: none; }
    .first-run .fr-title { font-weight: 600; font-size: 13px; }
    .first-run .fr-body { font-size: 12px; opacity: 0.88; margin: 3px 0 8px; line-height: 1.45; }
    .first-run .fr-blocked { display: block; opacity: 0.85; margin-top: 2px; }
    .first-run .fr-blocked[hidden] { display: none; }
    .first-run .fr-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    #curEngine { font-size: 12px; opacity: 0.8; }
    #saved { color: #4d9fff; font-size: 12px; min-height: 14px; margin-top: 2px; text-align: right; }
    /* 安装/卸载进行中的进度条：不确定态转圈 + 阶段文字。 */
    #pluginProgress {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 5px;
      font-size: 12px;
      color: #4d9fff;
    }
    #pluginProgress[hidden] { display: none; }
    .progress-track {
      position: relative;
      flex: 1;
      height: 5px;
      min-width: 80px;
      border-radius: 3px;
      overflow: hidden;
      background: rgba(77, 107, 254, 0.15);
    }
    .progress-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 40%;
      border-radius: 3px;
      background: linear-gradient(90deg, #4d6bfe, #4d9fff);
      animation: progressSlide 1.1s ease-in-out infinite;
    }
    @keyframes progressSlide {
      0% { left: -40%; }
      100% { left: 100%; }
    }
    @media (prefers-reduced-motion: reduce) {
      .progress-bar { animation: none; left: 0; width: 100%; opacity: 0.5; }
    }
  </style>
</head>
<body>
  <h1 data-i18n="settings.title"></h1>
  <p class="sub" data-i18n="settings.autoSave"></p>

  <main class="colgrid">
    <section class="g-close">
      <h2 data-i18n="settings.close"></h2>
      <div class="optrow">
        <label><input name="closeAction" type="radio" value="tray" /><span data-i18n="settings.close.tray"></span></label>
        <label><input name="closeAction" type="radio" value="quit" /><span data-i18n="settings.close.quit"></span></label>
      </div>
    </section>

    <section class="g-datadir">
      <h2 data-i18n="settings.dataDir"></h2>
      <div class="stack">
        <label>
          <input name="homeMode" type="radio" value="system" />
          <span>
            <span data-i18n="settings.home.system"></span><br />
            <span class="hint" style="margin:0;" data-i18n="settings.home.moveHint"></span>
          </span>
        </label>
        <label>
          <input name="homeMode" type="radio" value="app" />
          <span>
            <span data-i18n="settings.home.app"></span><br />
            <span class="hint" style="margin:0;" data-i18n="settings.home.moveHint"></span>
          </span>
        </label>
      </div>
    </section>

    <section class="g-engine">
      <h2 data-i18n="settings.engineUpdate"></h2>
      <div class="sub" style="margin-bottom:6px;" data-i18n="settings.engineUpdate.sub"></div>
      <div class="optrow">
        <span style="opacity:0.75;margin-right:2px;" data-i18n="settings.update.policy"></span>
        <label><input name="updatePolicy" type="radio" value="auto" /><span data-i18n="settings.update.policy.auto"></span></label>
        <label><input name="updatePolicy" type="radio" value="ask" /><span data-i18n="settings.update.policy.ask"></span></label>
        <label><input name="updatePolicy" type="radio" value="notify" /><span data-i18n="settings.update.policy.notify"></span></label>
      </div>
      <div class="optrow">
        <span style="opacity:0.75;margin-right:2px;" data-i18n="settings.update.channel"></span>
        <label><input name="updateChannel" type="radio" value="npm" /><span data-i18n="settings.update.channel.npm"></span></label>
        <label><input name="updateChannel" type="radio" value="rc" /><span data-i18n="settings.update.channel.rc"></span></label>
        <label><input name="updateChannel" type="radio" value="all" /><span data-i18n="settings.update.channel.all"></span></label>
      </div>
      <div class="stack" style="margin-top:2px;">
        <label>
          <input id="updateAutoCheck" type="checkbox" />
          <span>
            <span data-i18n="settings.update.autoCheck"></span><br />
            <span class="hint" style="margin:0;" data-i18n="settings.update.autoCheck.hint"></span>
          </span>
        </label>
      </div>
      <div id="checkRow">
        <button id="btnCheckUpdate" type="button" class="dsh-btn">
          <span data-i18n="settings.update.checkNow"></span>
        </button>
        <span id="curEngine"></span>
      </div>
    </section>

    <section class="g-plugins">
      <h2 data-i18n="settings.plugins"></h2>
      <div class="sub" style="margin-bottom:6px;" data-i18n="settings.plugins.sub"></div>
      <!-- 首次启动卡片：「随包插件默认全部关闭」意味着「装完打开即用」是一句空话。
           引擎就绪后主进程检测到还有该装没装的，会主动把本窗口打开（见 main.js 的
           maybeOfferFirstRun），卡片就在最上方：一次点击 = 装齐 + 自动重启一次引擎。 -->
      <div id="firstRun" class="first-run" hidden>
        <div class="fr-title" data-i18n="settings.firstRun.title"></div>
        <div class="fr-body">
          <span id="firstRunBody"></span>
          <span id="firstRunBlocked" class="fr-blocked" hidden></span>
        </div>
        <div class="fr-actions">
          <button id="btnFirstRunEnable" type="button" class="dsh-btn attn">
            <span id="firstRunEnableLabel"></span>
          </button>
          <button id="btnFirstRunLater" type="button" class="dsh-btn">
            <span data-i18n="settings.firstRun.later"></span>
          </button>
        </div>
      </div>
      <div id="pluginList"></div>
      <div id="pluginProgress" hidden>
        <span class="progress-track"><span class="progress-bar"></span></span>
        <span id="pluginProgressText">…</span>
      </div>
      <div style="display:flex;align-items:center;gap:10px;margin-top:4px;flex-wrap:wrap;">
        <button id="btnSyncPlugins" type="button" class="dsh-btn">
          <span data-i18n="settings.plugins.sync"></span>
        </button>
        <button id="btnRestartEngine" type="button" class="dsh-btn">
          <span data-i18n="settings.plugins.restart"></span>
        </button>
        <!-- 安装/卸载（改 bundle 列表）后必须重启引擎才生效：按钮旁给一个持续可见的
             「待重启」标注，引擎真的重启过之后自动消失（见 markRestartNeeded）。 -->
        <span id="restartBadge" class="plg-need-restart" hidden data-i18n="settings.plugins.needRestartBadge"></span>
        <button id="btnReloadPage" type="button" class="dsh-btn attn" hidden>
          <span data-i18n="settings.plugins.reloadPage"></span>
        </button>
        <span id="pluginMsg" style="font-size:12px;opacity:0.85;"></span>
      </div>
      <span class="hint" data-i18n="settings.plugins.restartHint"></span>
    </section>
  </main>

  <div id="saved"></div>

    // uiLang 优先来自主进程推送（跟随系统时由主进程解析），查询参数兜底。
    let uiLang = new URLSearchParams(location.search).get("lang") === "en" ? "en" : "zh";

    /** 取一条文案并做 {0}/{1} 填空（与主进程 L() 的占位符写法一致）。 */
    function t(key, ...args) {
      const table = I18N[uiLang] || I18N.zh;
      const raw = table[key] !== undefined ? table[key] : I18N.zh[key] !== undefined ? I18N.zh[key] : key;
      return args.reduce((out, value, index) => out.split("{" + index + "}").join(String(value)), raw);
    }

    function applyTexts() {
      const table = I18N[uiLang] || I18N.zh;
      document.querySelectorAll("[data-i18n]").forEach((el) => {
        const key = el.getAttribute("data-i18n");
        if (table[key] !== undefined) el.textContent = table[key];
      });
      document.documentElement.lang = uiLang === "en" ? "en" : "zh-CN";
      document.title = uiLang === "en" ? "Settings — DSH Ready GUI" : "设置 — DSH Ready GUI";
    }

    // ---- 第三方插件列表（数据来自主进程 payload） ----
    function esc(str) {
      return String(str ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
    /** 属性值转义（在 esc 之外还要处理引号，否则描述里的引号会截断属性）。 */
    function escAttr(str) {
      return esc(str).replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function stateText(id, s) {
      const st = (s.pluginStatus || {})[id];
      if (st && st.installed) return t("settings.plugins.installed", st.version || "?");
      return t("settings.plugins.notInstalled");
    }
    /** 启用/禁用状态文案（含来源：市场 / profile 补丁层）。 */
    function enabledText(st) {
      if (!st || !st.installed) return t("settings.plugins.notInstalledEnable");
      if (st.enabled) return t("settings.plugins.enabled");
      if (st.disabledBy === "patch") return t("settings.plugins.disabledByPatch");
      return t("settings.plugins.disabledByMarket");
    }

    /** 目录条目 id → 当前语言的名字（目录来自主进程 payload）。 */
    function catalogLabel(id) {
      const entry = (window.__lastCatalog || []).find((c) => c.id === id);
      if (!entry) return id;
      return uiLang === "en" ? entry.en || entry.pkg : entry.zh || entry.pkg;
    }

    // ---- 首次启动卡片 ----------------------------------------------------------
    // 「随包插件默认全部关闭」的直接后果：装完 GUI 打开，那四个修复一个都没生效。
    // 主进程在引擎就绪后检测到这种情况会主动把本窗口打开（见 main.js 的 maybeOfferFirstRun），
    // 卡片就在插件区最上方：一次点击 = 装齐 + 自动重启一次引擎。
    //
    // 显示与消失**完全跟随主进程的 payload**（s.firstRun.offer / missing）：渲染层不做任何
    // 判断，避免两侧各有一套规则而悄悄漂移（装完 missing 空 → offer=false → 下一次 paint 自动隐藏）。
    let firstRunScrolled = false;
    function renderFirstRun(s) {
      const card = document.getElementById("firstRun");
      if (!card) return;
      const fr = s.firstRun || {};
      const missing = Array.isArray(fr.missing) ? fr.missing : [];
      const blocked = Array.isArray(fr.blocked) ? fr.blocked : [];
      const show = fr.offer === true && missing.length > 0;
      card.hidden = !show;
      if (!show) return;
      const sep = uiLang === "en" ? ", " : "、";
      document.getElementById("firstRunBody").textContent = t("settings.firstRun.body", missing.map(catalogLabel).join(sep));
      const blockedEl = document.getElementById("firstRunBlocked");
      if (blocked.length > 0) {
        blockedEl.textContent = t("settings.firstRun.blocked", blocked.map(catalogLabel).join(sep));
        blockedEl.hidden = false;
      } else {
        blockedEl.textContent = "";
        blockedEl.hidden = true;
      }
      document.getElementById("firstRunEnableLabel").textContent = t("settings.firstRun.enable", String(missing.length));
      // 首次启动是「主进程主动打开这个窗口」的：卡片在插件区，窗口默认停在顶部，不滚过去
      // 用户只会看到一个普通设置页。每次页面加载只滚一次，之后不跟用户抢滚动条。
      if (!firstRunScrolled) {
        firstRunScrolled = true;
        try {
          card.scrollIntoView({ block: "center" });
        } catch {
          /* 没有该重载也不致命：卡片仍在正确位置 */
        }
      }
    }

    // ---- 「待重启引擎」标注 ----------------------------------------------------
    // 哪些操作需要重启引擎（按引擎实现）：**安装 / 卸载**改的是 profile 的 bundle 列表，
    // 引擎只在启动时 compose 它，所以必须重启；**启用 / 禁用**写的是补丁层，由引擎 live
    // 热重载即时生效，不需要重启（含页面半边的插件另需刷新页面，走「刷新页面」按钮）。
    // 标注是**常驻**的（按钮持续脉冲 + 旁边一枚「待重启引擎」小标签），直到引擎真的重启过：
    // 既在点击重启按钮时清除，也在 paint() 里观察到 engineRunning 由 false 变 true 时清除
    // （用户从托盘/重开应用重启也算）。这样不会出现「提示一闪而过、用户没看见」的情况。
    let pendingEngineRestart = false;
    // 只有「先见过引擎在运行」之后观察到的 down 才算一次真正的重启——否则设置窗口
    // 先于引擎启动完成打开时（engineRunning:false）会被误判，引擎一就绪就把标注清掉。
    let sawEngineUp = false;
    let sawEngineDown = false;
    function markRestartNeeded(needed) {
      pendingEngineRestart = Boolean(needed);
      sawEngineDown = false; // 从这一刻起重新观察一次真正的重启
      const badge = document.getElementById("restartBadge");
      const btn = document.getElementById("btnRestartEngine");
      if (badge) badge.hidden = !pendingEngineRestart;
      if (btn) {
        if (pendingEngineRestart && !btn.disabled) btn.classList.add("attn");
        else btn.classList.remove("attn");
      }
    }
    /** 观察到引擎重启过（up → down → up）就撤掉标注。 */
    function settleRestartBadge(s) {
      if (!s) return;
      if (s.engineRunning === true) {
        if (pendingEngineRestart && sawEngineDown) markRestartNeeded(false);
        sawEngineUp = true;
        sawEngineDown = false;
        return;
      }
      // engineRunning !== true：只有在见过引擎运行之后，这才是一次「引擎停了」。
      if (sawEngineUp) sawEngineDown = true;
    }
    // 两个独立状态，各自镜像各自的真实状态、互不持久化“期望”集合：
    //   - 安装勾选框：装了即勾、没装即不勾 → 勾选立即安装 / 取消立即卸载；
    //   - 启用开关：启用即开、禁用即关 → 开启恢复加载 / 关闭只是不加载（不卸载）。
    // 两者都来自同一份 profile（bundles + 补丁层 + 市场 state.json），因此市场
    // 那边的改动会经 watch 广播回来重绘，这里改的也会写回同一份文件。
    // busy 期间（安装/卸载/启用/禁用/修复进行中）所有勾选框与操作按钮一并禁用，
    // 避免两个 pnpm 同时改同一个 profile 造成卡顿/锁冲突。
    function renderPlugins(s) {
      const box = document.getElementById("pluginList");
      if (!box) return;
      const catalog = Array.isArray(s.pluginCatalog) ? s.pluginCatalog : [];
      const status = s.pluginStatus || {};
      const busy = window.__pluginBusy === true;
      box.innerHTML = catalog
        .map((entry) => {
          const title = uiLang === "en" ? entry.en : entry.zh;
          const desc = uiLang === "en" ? entry.enDesc : entry.zhDesc;
          const blocked = entry.engineOk === false;
          const engineHint = blocked ? (uiLang === "en" ? entry.enEngine : entry.zhEngine) : "";
          const st = status[entry.id];
          const installed = Boolean(st && st.installed);
          // 与 plugin-state.js 的 `enabled: s.enabled === undefined ? true : Boolean(s.enabled)` 同极性：
          // 状态缺失时按「引擎默认加载」处理。开关只在 installed 时渲染，所以这里取 false 也
          // 不会画出错误的勾选态（未安装就不显示开关）。
          const enabled = st ? st.enabled !== false : false;
          const state = blocked
            ? t("settings.engineIncompatible")
            : stateText(entry.id, s);
          // 市场已禁用、但补丁层还没落下 → 引擎仍会加载它（两端不一致）。
          const drift = Boolean(st && st.installed && st.marketDisabled && !st.patchDisabled);
          // 随包副本比已装的新 → 显示目标版本 + 一个「更新」按钮。它走的是与「修复 / 重试」
          // **同一个**主进程动作（settings:plugin-sync），所以进度条、busy 锁、「待重启」标注
          // 都是现成的；判定也来自主进程（catalogStatus.updateAvailable），界面不自己猜。
          const updateAvailable = Boolean(st && st.updateAvailable);
          const updateHint = updateAvailable
            ? '<span class="hint" style="margin:0;display:block;color:#e8b96b;">↑ ' +
              esc(t("settings.plugins.updateAvailable", String(st.bundledVersion || "?"))) +
              "</span>"
            : "";
          const updateRow = updateAvailable
            ? '<button type="button" class="dsh-btn plg-update" data-id="' +
              escAttr(entry.id) +
              '"' +
              (busy ? " disabled" : "") +
              ' style="margin:2px 0 0 24px;">' +
              esc(t("settings.plugins.update")) +
              "</button>"
            : "";
          // 启用开关：只在已安装时出现（没装就无所谓启用）。
          // 注意必须放在安装 <label> **外面**：HTML 里 label 会把它内部第一个
          // 可标注控件当成自己的目标，把启用勾选框嵌进去会让「点启用」顺带切换
          // 安装勾选框（= 意外卸载）。所以启用开关是 .plg-row 的兄弟节点。
          const enableRow = installed
            ? '<label class="plg-enable-label" style="cursor:' + (busy ? "not-allowed" : "pointer") + ';">' +
              '<input type="checkbox" class="plg-enable" data-id="' + escAttr(entry.id) + '" ' + (enabled ? "checked" : "") +
              (busy ? " disabled" : "") +
              ' style="accent-color:#4d9fff;" />' +
              '<span class="hint" style="margin:0;">' +
              esc(t("settings.plugins.enableLabel")) +
              "</span></label>"
            : "";
          return (
            '<div class="plg-row">' +
            '<label class="plg" style="display:flex;gap:7px;align-items:flex-start;cursor:' + (blocked ? "not-allowed" : "pointer") + ';">' +
            '<input type="checkbox" class="plg-check" data-id="' + escAttr(entry.id) + '" ' + (installed ? "checked" : "") +
            (blocked || busy ? " disabled" : "") +
            ' style="margin-top:3px;accent-color:#4d6bfe;" />' +
            "<span>" +
            // 标题已经带上包名时（如「按键设置（dsh-keys-setting）」）不再重复追加一次，省一行宽度。
            '<span class="plg-title">' + esc(title) +
            (title.includes(entry.pkg) ? "" : " — <code style=\"opacity:.7\">" + esc(entry.pkg) + "</code>") +
            "</span><br/>" +
            // 描述只占一行（CSS clamp），全文放悬停提示，便于把窗口压小。
            '<span class="hint plg-desc" title="' + escAttr(desc) + '">' + esc(desc) + "</span>" +
            (blocked && engineHint
              ? '<span class="hint" style="margin:0;display:block;color:#e8806b;">⚠ ' + esc(engineHint) + "</span>"
              : "") +
            // 状态行：状态 + 仅针对该插件的能力标签。安装/卸载需重启、启用/禁用热重载这两条
            // 通用规则写在段落说明里（每行重复只会把窗口撑大），这里只标「含页面部分」这类
            // 因插件而异的事实（由主进程读 package.json 的 dsh.client 得出，见 pluginHasClientHalf）。
            '<span class="plg-state hint" style="color:' + (blocked ? "#e8806b" : "#4d9fff") + ';">' +
            esc(state) +
            (installed
              ? ' · <span class="plg-enable-state" style="color:' + (enabled ? "#3fb950" : "#e8806b") + ';">' +
                esc(enabledText(st)) +
                "</span>"
              : "") +
            (st && st.client === true
              ? '<span class="plg-tag">' + esc(t("settings.plugins.pageHalfTag")) + "</span>"
              : "") +
            "</span>" +
            (drift
              ? '<span class="hint" style="margin:0;display:block;color:#e8b96b;">⚠ ' +
                esc(t("settings.plugins.driftHint")) +
                "</span>"
              : "") +
            updateHint +
            "</span></label>" +
            enableRow +
            updateRow +
            "</div>"
          );
        })
        .join("");
    }

    // ---- 安装/卸载/修复 进度条 ----
    function progressEl() {
      return document.getElementById("pluginProgress");
    }
    function progressTextEl() {
      return document.getElementById("pluginProgressText");
    }
    /** 主进程逐阶段日志 → 友好文案；不认识的原始行保持上一次文案不覆盖。 */
    function friendlyProgress(text) {
      // 注意别把局部变量命名成 `t`：那会遮蔽翻译函数 t()，函数体里再想用翻译函数就会抛
      // TypeError（这里原先就是 `const t = …`）。
      const raw = String(text || "");
      if (/installing\s|dsh plugin --profile web add|plugin install failed/.test(raw))
        return t("settings.plugins.installingShort");
      if (/removing\s|dsh plugin --profile web remove|plugin removed:/.test(raw))
        return t("settings.plugins.uninstallingShort");
      if (/install pnpm/.test(raw)) return t("settings.plugins.preparingPnpm");
      if (/stage/i.test(raw)) return t("settings.plugins.preparingBundle");
      return null;
    }
    /** busy 锁：一次只允许一个插件操作；进行中显示进度条并禁用全部操作。 */
    function setPluginBusy(busy, headerText) {
      window.__pluginBusy = Boolean(busy);
      // 这次 busy 切换直接改了列表里勾选框的 disabled，必须让下一次 paint 重建列表
      // （见 paint 里的 __pluginsDirty）。
      window.__pluginsDirty = true;
      const prog = progressEl();
      if (prog) {
        prog.hidden = !window.__pluginBusy;
        if (headerText) progressTextEl().textContent = headerText;
      }
      const list = document.getElementById("pluginList");
      const syncBtn = document.getElementById("btnSyncPlugins");
      const restartBtn = document.getElementById("btnRestartEngine");
      const reloadBtn = document.getElementById("btnReloadPage");
      // 更新检查会 kill 引擎并整体换掉 dsh-engine 目录；数据目录切换会移动/删除 harness home。
      // 两者都与插件的安装/卸载争用同一批文件（引擎树、profile），所以必须在 busy 锁里 ——
      // 否则一次确认过的引擎更新可以在插件安装跑到一半时把引擎目录换走。
      const checkBtn = document.getElementById("btnCheckUpdate");
      const homeRadios = Array.from(document.querySelectorAll('input[name="homeMode"]'));
      // 首次启动卡片的两颗按钮也算插件操作入口（一键开启会跑 pnpm），一样纳入 busy 锁。
      const frEnableBtn = document.getElementById("btnFirstRunEnable");
      const frLaterBtn = document.getElementById("btnFirstRunLater");
      if (window.__pluginBusy) {
        if (list) list.querySelectorAll(".plg-check, .plg-enable, .plg-update").forEach((b) => { b.disabled = true; });
        if (syncBtn) { window.__syncWasDisabled = syncBtn.disabled; syncBtn.disabled = true; }
        if (restartBtn) { window.__restartWasDisabled = restartBtn.disabled; restartBtn.disabled = true; }
        if (reloadBtn) { window.__reloadWasDisabled = reloadBtn.disabled; reloadBtn.disabled = true; }
        if (checkBtn) { window.__checkWasDisabled = checkBtn.disabled; checkBtn.disabled = true; }
        window.__homeWasDisabled = homeRadios.map((r) => r.disabled);
        homeRadios.forEach((r) => { r.disabled = true; });
        if (frEnableBtn) { window.__frEnableWasDisabled = frEnableBtn.disabled; frEnableBtn.disabled = true; }
        if (frLaterBtn) { window.__frLaterWasDisabled = frLaterBtn.disabled; frLaterBtn.disabled = true; }
      } else {
        // 恢复各按钮进入 busy 前的可用状态（勾选框由 paint 按新状态重绘）。
        if (syncBtn) syncBtn.disabled = window.__syncWasDisabled === true;
        if (restartBtn) restartBtn.disabled = window.__restartWasDisabled === true;
        if (reloadBtn) reloadBtn.disabled = window.__reloadWasDisabled === true;
        if (checkBtn) checkBtn.disabled = window.__checkWasDisabled === true;
        if (Array.isArray(window.__homeWasDisabled)) {
          homeRadios.forEach((r, i) => { r.disabled = window.__homeWasDisabled[i] === true; });
        }
        if (frEnableBtn) frEnableBtn.disabled = window.__frEnableWasDisabled === true;
        if (frLaterBtn) frLaterBtn.disabled = window.__frLaterWasDisabled === true;
        // busy 期间按钮是禁用的，markRestartNeeded 那时加不上高亮；这里按当前状态补一次。
        markRestartNeeded(pendingEngineRestart);
      }
    }

    let lastPaintLang = null;
    let lastPluginsFingerprint = null;

    function paint(s) {
      if (s.uiLang === "zh" || s.uiLang === "en") uiLang = s.uiLang;
      // applyTexts() 对整个文档跑 querySelectorAll 并重写每个 data-i18n 节点，而它只跟语言
      // 有关；paint() 在一次操作里会被调用两次（操作完成后一次、busy 解锁后一次），语言没变
      // 就没必要重跑。
      if (uiLang !== lastPaintLang) {
        lastPaintLang = uiLang;
        applyTexts();
      }
      document.querySelectorAll('input[name="homeMode"]').forEach((el) => { el.checked = el.value === s.dshHomeMode; });
      document.querySelectorAll('input[name="closeAction"]').forEach((el) => { el.checked = el.value === s.closeAction; });
      document.querySelectorAll('input[name="updatePolicy"]').forEach((el) => { el.checked = el.value === s.updatePolicy; });
      document.querySelectorAll('input[name="updateChannel"]').forEach((el) => { el.checked = el.value === s.updateChannel; });
      document.getElementById("updateAutoCheck").checked = s.updateCheckEnabled !== false;
      window.__lastPayload = s;
      window.__lastCatalog = Array.isArray(s.pluginCatalog) ? s.pluginCatalog : [];
      renderFirstRun(s);
      // renderPlugins 会整段替换 #pluginList 的 innerHTML，而它渲染用到的输入就这几样：
      // 语言、busy 锁、目录、每个条目的状态。指纹没变就不重建（否则每次广播都白重建一遍）。
      // __pluginsDirty 是显式失效位：setPluginBusy 会直接改列表里勾选框的 disabled，并依赖
      // 下一次 paint 重建来还原 —— 有它在，即使将来 busy 与指纹的耦合变了也不会漏重建。
      const fingerprint = JSON.stringify([uiLang, window.__pluginBusy === true, s.pluginCatalog, s.pluginStatus]);
      if (fingerprint !== lastPluginsFingerprint || window.__pluginsDirty === true) {
        lastPluginsFingerprint = fingerprint;
        window.__pluginsDirty = false;
        renderPlugins(s);
      }
      const cur = document.getElementById("curEngine");
      const eng = s.installedEngine;
      const engTxt = eng
        ? t("settings.currentEngine", String(eng))
        : t("settings.engineNotInstalled");
      if (cur && cur.textContent !== engTxt) cur.textContent = engTxt;
      // 引擎真的重启过就撤掉「待重启引擎」标注（无论用户是怎么重启的）。
      settleRestartBadge(s);
    }

    let flashTimer = null;
    function flashSaved() {
      const el = document.getElementById("saved");
      el.textContent = t("settings.saved");
      clearTimeout(flashTimer);
      flashTimer = setTimeout(() => { el.textContent = ""; }, 1200);
    }

    api.onChanged(paint);

    // 主进程逐阶段推送安装/卸载进度（微调正在进行的文案）。
    api.onPluginProgress((p) => {
      const friendly = friendlyProgress(p && p.text);
      if (friendly) progressTextEl().textContent = friendly;
    });

    // 引擎页面/外观设置变更时实时切换本窗口深浅色（主进程 app:theme 推送）。
    api.onTheme((theme) => {
      if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
    });

    // ---- 首次启动卡片的两颗按钮 -------------------------------------------------
    // 结果一律写进插件区底部那条 #pluginMsg：卡片在装成功后**必然消失**（offer 由 payload
    // 推导），把结果写在卡片里就会出现「点完按钮、消息跟着卡片一起没了」。
    function pluginMsgEl() {
      return document.getElementById("pluginMsg");
    }
    const frMsg = (text) => {
      const el = pluginMsgEl();
      if (el) el.textContent = text;
    };
    (function wireFirstRun() {
      const btnEnable = document.getElementById("btnFirstRunEnable");
      const btnLater = document.getElementById("btnFirstRunLater");
      if (!btnEnable || !btnLater) return;
      const sep = () => (uiLang === "en" ? ", " : "、");
      btnEnable.addEventListener("click", async () => {
        if (btnEnable.disabled) return;
        const header = t("settings.firstRun.installing");
        setPluginBusy(true, header);
        frMsg("");
        try {
          const res = await api.enableRecommendedPlugins();
          const fresh = await api.get().catch(() => null);
          if (fresh) paint(fresh);
          if (res && res.ok) {
            const installedNames = (res.installed || []).map(catalogLabel).join(sep());
            const skippedNames = (res.skipped || []).map(catalogLabel).join(sep());
            let message;
            if (installedNames) {
              // 主进程已经自己去重启引擎了：重启回来这些插件才真正加载。引擎没在跑
              // （或正在重启）时重启请求会被拒 —— 绝不假装已生效，把「待重启引擎」标注打上。
              message = res.restart
                ? t("settings.firstRun.done", installedNames)
                : t("settings.firstRun.needRestart", installedNames);
              if (!res.restart) markRestartNeeded(true);
              if (skippedNames) message += " " + t("settings.firstRun.skipped", skippedNames);
            } else if (skippedNames) {
              // 一个都没装（全部与引擎不兼容）：没有任何改动，也就不该打「待重启」标注。
              message = t("settings.firstRun.skipped", skippedNames);
            } else {
              // 竞态兜底：点下去的那一刻它们已经被装上了（插件市场那边刚装完）——
              // 别把这种情况说成「不兼容」，如实说没动作可做。
              message = t("settings.firstRun.nothing");
            }
            frMsg(message);
          } else {
            const detail = (res && ((res.errors && res.errors[0]) || res.error)) || "?";
            frMsg(t("settings.firstRun.failed", String(detail)));
          }
        } catch (error) {
          frMsg(t("settings.firstRun.failed", String((error && error.message) || error)));
        } finally {
          setPluginBusy(false);
          const freshFinal = await api.get().catch(() => window.__lastPayload || null);
          if (freshFinal) paint(freshFinal);
        }
      });
      btnLater.addEventListener("click", async () => {
        if (btnLater.disabled) return;
        btnLater.disabled = true;
        try {
          await api.dismissFirstRun();
          const fresh = await api.get().catch(() => null);
          if (fresh) paint(fresh);
        } catch (error) {
          frMsg(t("settings.firstRun.failed", String((error && error.message) || error)));
          btnLater.disabled = false;
        }
      });
    })();

    // 内容高度自适应：语言切换 / 数据到达 / 主题变化时通知主进程重设窗口高度。
    let rafPending = false;
    // 上一次真的发出去的高度。ResizeObserver 观察的是 document.body，而主进程收到高度会
    // setContentSize —— 那又会改变布局、再次触发 observer。没有这个去重就是一个
    // 「观察 → IPC → 改窗口 → 再观察」的回路（rafPending 只在同一帧内合并，挡不住下一帧）。
    let lastReportedHeight = -1;
    function reportHeight() {
      if (rafPending) return;
      rafPending = true;
      requestAnimationFrame(() => {
        rafPending = false;
        const h = Math.ceil(document.body.scrollHeight + 8);
        if (h === lastReportedHeight) return; // 高度没变：不必再惊动主进程
        lastReportedHeight = h;
        // api.autoSize 是 ipcRenderer.invoke（返回 Promise），try/catch 抓不到它的拒绝，
        // 必须挂 .catch —— 否则窗口在调用途中被销毁就是一条未处理的 rejection。
        api.autoSize(h).catch(() => {})
      });
    }
    if (typeof ResizeObserver === "function") {
      const ro = new ResizeObserver(() => reportHeight());
      ro.observe(document.body);
    }
    window.addEventListener("load", reportHeight);
    // theme 查询参数在脚本末尾设置，DOM 高度可能变化 → 由 ResizeObserver 兜底。
    api.get().then((s) => {
      paint(s);
      document.querySelectorAll('input[name="homeMode"]').forEach((el) => {
        el.addEventListener("change", () => {
          if (!el.checked) return;
          // 迁移确认框被取消时 main 不会保存（甚至原样返回）—— 那种情况下闪「已保存」是错的，
          // 而且单选框还停留在新值上，直到下一次 broadcast 才被改回去。
          api.set({ dshHomeMode: el.value }).then((res) => {
            if (res && res.applied === false) {
              if (s && s.dshHomeMode) {
                document.querySelectorAll('input[name="homeMode"]').forEach((other) => {
                  other.checked = other.value === s.dshHomeMode;
                });
              }
              return;
            }
            flashSaved();
          });
        });
      });
      document.querySelectorAll('input[name="closeAction"]').forEach((el) => {
        el.addEventListener("change", () => el.checked && api.set({ closeAction: el.value }).then(() => flashSaved()));
      });
      document.querySelectorAll('input[name="updatePolicy"]').forEach((el) => {
        el.addEventListener("change", () => el.checked && api.set({ updatePolicy: el.value }).then(() => flashSaved()));
      });
      document.querySelectorAll('input[name="updateChannel"]').forEach((el) => {
        el.addEventListener("change", () => el.checked && api.set({ updateChannel: el.value }).then(() => flashSaved()));
      });
      document.getElementById("updateAutoCheck").addEventListener("change", (e) => {
        api.set({ updateCheckEnabled: e.target.checked }).then(() => flashSaved());
      });

      // 第三方插件：勾选框 = 安装状态的实时镜像。勾选 → 立即安装，取消 → 立即
      // 卸载（引擎与插件市场都改同一个 profiles/web/package.json，状态变化会经
      // broadcast 推回来重绘，因此这里不用再写回任何“期望”集合）。
      //
      // 安装/卸载有真实耗时（pnpm/引擎子进程），期间：显示进度条 + 禁用全部
      // 勾选框与操作按钮（busy 锁），完成后恢复——避免无反馈的“卡窗口”观感，
      // 也避免两个操作并发改同一个 profile。
      const pluginList = document.getElementById("pluginList");
      const pluginMsg = document.getElementById("pluginMsg");
      const pluginLabel = (id) => catalogLabel(id);
      pluginList.addEventListener("change", async (e) => {
        if (!e.target) return;
        // ---- 启用 / 禁用开关（不卸载，只切换引擎是否加载）----
        if (e.target.classList.contains("plg-enable")) {
          const id = e.target.getAttribute("data-id");
          const wantEnabled = e.target.checked;
          const label = pluginLabel(id);
          setPluginBusy(
            true,
            wantEnabled ? t("settings.plugins.enabling", label) : t("settings.plugins.disabling", label),
          );
          pluginMsg.textContent = "";
          try {
            const res = await api.setPluginEnabled(id, wantEnabled);
            const fresh = await api.get().catch(() => null);
            if (fresh) paint(fresh);
            if (res && res.ok) {
              // 与市场开关一致的语义：引擎侧已在线生效；带客户端半体的插件还需要
              // 刷新 Harness 页面，页面里已加载的那半才会消失/出现（市场也是返回
              // refresh 并提示「刷新后生效」）。需要重启时则提示重启。
              const reloadBtn = document.getElementById("btnReloadPage");
              if (res.refresh) {
                pluginMsg.textContent = t("settings.plugins.needRefresh");
                if (reloadBtn) reloadBtn.hidden = false;
              } else {
                pluginMsg.textContent = wantEnabled
                  ? t("settings.plugins.enableDone")
                  : t("settings.plugins.disableDone");
                if (reloadBtn) reloadBtn.hidden = true;
              }
              if (res.restart) {
                pluginMsg.textContent = t("settings.plugins.needRestart");
                markRestartNeeded(true);
              }
            } else {
              pluginMsg.textContent = t("settings.plugins.failed", String((res && res.error) || "?"));
            }
          } catch (error) {
            pluginMsg.textContent = t("settings.plugins.failed", String((error && error.message) || error));
            const fresh = await api.get().catch(() => null);
            if (fresh) paint(fresh);
          } finally {
            setPluginBusy(false);
            const freshFinal = await api.get().catch(() => window.__lastPayload || null);
            if (freshFinal) paint(freshFinal);
          }
          return;
        }
        // ---- 安装 / 卸载勾选框 ----
        if (!e.target.classList.contains("plg-check")) return;
        const id = e.target.getAttribute("data-id");
        const wantChecked = e.target.checked;
        const label = pluginLabel(id);
        const header = wantChecked
          ? t("settings.plugins.installing", label)
          : t("settings.plugins.uninstalling", label);
        setPluginBusy(true, header);
        pluginMsg.textContent = "";
        try {
          const res = wantChecked ? await api.installPlugin(id) : await api.uninstallPlugin(id);
          const fresh = await api.get();
          paint(fresh);
          if (res && res.ok) {
            // 安装和卸载都改了 profile 的 bundle 列表 → 两者都需要重启引擎才挂载/消失。
            pluginMsg.textContent = t("settings.plugins.needRestart");
            markRestartNeeded(true);
          } else if (res && res.skipped) {
            pluginMsg.textContent = t("settings.engineIncompatible");
          } else {
            pluginMsg.textContent = t("settings.plugins.failed", String((res && res.error) || "?"));
          }
        } catch (error) {
          pluginMsg.textContent = t("settings.plugins.failed", String((error && error.message) || error));
          const fresh = await api.get().catch(() => null);
          if (fresh) paint(fresh);
        } finally {
          // 恢复交互：解锁全部勾选框与操作按钮（按新状态重绘），隐藏进度条。
          setPluginBusy(false);
          const freshFinal = await api.get().catch(() => window.__lastPayload || null);
          if (freshFinal) paint(freshFinal);
        }
      });
      const btnSyncPlugins = document.getElementById("btnSyncPlugins");
      const syncLabel = btnSyncPlugins.querySelector("span");
      const btnRestartEngine = document.getElementById("btnRestartEngine");
      const restartLabel = btnRestartEngine.querySelector("span");
      // 「刷新页面」：与市场开关的 refresh 信号对应——引擎侧已经切换完成，但页面里
      // 已加载的客户端半体要重新加载页面才与之一致。
      const btnReloadPage = document.getElementById("btnReloadPage");
      if (btnReloadPage) {
        btnReloadPage.addEventListener("click", async () => {
          btnReloadPage.disabled = true;
          pluginMsg.textContent = t("settings.plugins.reloading");
          try {
            const res = await api.reloadEngineWindow();
            if (res && res.ok === false) {
              pluginMsg.textContent = t("settings.plugins.reloadUnavailable", String(res.error || "?"));
              return;
            }
            // 刷新成功后按钮**保持可见**：下一次「启用/禁用带页面半边的插件」还要用它。
            // 之前这里是 hidden = true，而只有 enable 成功路径会把它重新显示 —— 于是刷过一次
            // 之后，用户再禁用/启用别的插件就再也找不到这个按钮了（提示里却还在让他点它）。
            pluginMsg.textContent = t("settings.plugins.reloaded");
          } catch (error) {
            pluginMsg.textContent = t("settings.plugins.failed", String((error && error.message) || error));
          } finally {
            btnReloadPage.disabled = false;
          }
        });
      }
      btnRestartEngine.addEventListener("click", async () => {
        if (btnRestartEngine.disabled) return;
        btnRestartEngine.disabled = true;
        // 先记下「有待重启的改动」再清标注：重启失败时要把标注放回去，否则界面会假装
        // 什么都不用做，而那次「需重启才生效」的改动其实一直没落地。
        const wasPending = pendingEngineRestart;
        markRestartNeeded(false);
        const orig = restartLabel.textContent;
        restartLabel.textContent = t("settings.plugins.restarting");
        pluginMsg.textContent = "";
        try {
          const res = await api.restartEngine();
          if (res && res.ok === false) {
            pluginMsg.textContent = t("settings.plugins.restartUnavailable", String(res.reason || "?"));
            restartLabel.textContent = orig;
            btnRestartEngine.disabled = false;
            if (wasPending) markRestartNeeded(true); // 重启没发生：标注放回去
            return;
          }
          // 引擎重启中：稍后由 paint(engineRunning=false→true) 反映；按钮短暂保持禁用。
          setTimeout(() => {
            restartLabel.textContent = orig;
            btnRestartEngine.disabled = false;
          }, 2000);
        } catch (error) {
          pluginMsg.textContent = t("settings.plugins.failed", String((error && error.message) || error));
          restartLabel.textContent = orig;
          btnRestartEngine.disabled = false;
          if (wasPending) markRestartNeeded(true); // 重启没发生：标注放回去
        }
      });
      // 「修复 / 重试」与每个插件行里的「更新」是**同一件事**：以「当前已安装集合」为目标
      // 再对账一遍，把比随包副本旧的换掉。抽成一个函数，两处调用，免得两份进度/消息/待重启
      // 逻辑各写一遍而慢慢漂移。
      async function runPluginSync(busyText) {
        const orig = syncLabel.textContent;
        syncLabel.textContent = t("settings.plugins.syncing");
        pluginMsg.textContent = "";
        markRestartNeeded(false);
        // busy 锁由 setPluginBusy 统一管理（它会先快照当前 disabled 再置 true，退出时还原）。
        // 这里**不要**自己先 `disabled = true`：那样快照到的就是 true，还原后按钮永远点不动。
        setPluginBusy(true, busyText || t("settings.plugins.repairing"));
        try {
          const res = await api.syncPlugins();
          const fresh = await api.get();
          paint(fresh);
          // A FAILED sync has no installed/removed/errors arrays to count, so deriving
          // everything from those arrays rendered `{ok:false, error:"busy"|"unauthorized"}` as
          // "插件状态一致 —— 无需重启引擎" — a failure shown as success. Check `ok` first.
          if (res && res.ok === false) {
            pluginMsg.textContent = t("settings.plugins.failed", String(res.error || "?"));
            // Do not touch the restart badge: this run told us nothing about it. The `finally`
            // below still releases the busy lock and restores the labels.
            return;
          }
          const failN = (res && Array.isArray(res.errors) ? res.errors.length : 0) || 0;
          const okN = (res && Array.isArray(res.installed) ? res.installed.length : 0) || 0;
          const remN = (res && Array.isArray(res.removed) ? res.removed.length : 0) || 0;
          const skipN = (res && Array.isArray(res.skipped) ? res.skipped.length : 0) || 0;
          // `changed` means "this pass altered the installed set", which is NOT the same as
          // "the running engine still needs a restart". A previously installed plugin that
          // this pass reconciled to the same shape reports changed=false while the engine
          // still has not loaded it — clearing the badge there made the plugin silently never
          // load until the app was restarted. Keep any pending restart.
          const changed = Boolean(res && res.changed) || okN + remN > 0;
          const needsRestart = changed || pendingEngineRestart;
          const head =
            okN + remN + skipN + failN > 0
              ? t("settings.plugins.done", String(okN), String(remN), String(failN + skipN))
              : t("settings.plugins.inSync");
          const tail = needsRestart
            ? t("settings.plugins.needRestartSuffix")
            : t("settings.plugins.noRestartSuffix");
          pluginMsg.textContent = head + tail;
          if (failN > 0 && Array.isArray(res.errors) && res.errors[0]) {
            pluginMsg.textContent += t("settings.plugins.firstError", String(res.errors[0]));
          }
          // 有实际变动（新装/卸载/捆绑更新）或本来就有待重启：标注「待重启引擎」。
          markRestartNeeded(needsRestart);
        } catch (error) {
          pluginMsg.textContent = t("settings.plugins.failed", String((error && error.message) || error));
        } finally {
          setPluginBusy(false);
          const freshFinal = await api.get().catch(() => window.__lastPayload || null);
          if (freshFinal) paint(freshFinal);
          syncLabel.textContent = orig;
          // 不能用 `= false` 硬覆盖：setPluginBusy(false) 刚刚按进入 busy 前的快照恢复了
          // 这个按钮（它可能本就该是禁用的），硬写 false 会把快照结论推翻。
          btnSyncPlugins.disabled = window.__syncWasDisabled === true;
        }
      }

      btnSyncPlugins.addEventListener("click", async () => {
        if (btnSyncPlugins.disabled) return;
        await runPluginSync();
      });

      // 插件行里的「更新」按钮（只有主进程报「随包副本更新」时才渲染出来）。
      pluginList.addEventListener("click", async (e) => {
        const btn = e.target && e.target.closest ? e.target.closest(".plg-update") : null;
        if (!btn || btn.disabled) return;
        const id = btn.getAttribute("data-id");
        await runPluginSync(t("settings.plugins.updating", catalogLabel(id)));
      });

      const btnCheck = document.getElementById("btnCheckUpdate");
      const checkLabel = btnCheck.querySelector("span");
      btnCheck.addEventListener("click", async () => {
        if (btnCheck.disabled) return;
        btnCheck.disabled = true;
        const orig = checkLabel.textContent;
        checkLabel.textContent = t("settings.plugins.checking");
        const restore = (text, delay) => {
          setTimeout(() => {
            checkLabel.textContent = text;
            btnCheck.disabled = false;
          }, delay);
        };
        try {
          const res = await api.checkUpdate();
          if (res && res.busy) {
            // 主进程已有检查在进行：提示后恢复按钮。
            checkLabel.textContent = t("settings.plugins.checkBusy");
            restore(orig, 1500);
            return;
          }
          if (res && res.installed) {
            const s2 = await api.get();
            paint(s2);
          }
          restore(orig, 800);
        } catch {
          restore(orig, 800);
        }
      });
    }).catch((error) => {
      // The whole wiring lives inside this callback, so an unhandled rejection here left an
      // empty, inert window with no explanation — and `paint(null)` inside would have thrown
      // anyway. Say what happened instead (main.js can resolve `settings:get` as null, and it
      // rejects if the payload build fails).
      try {
        const msg = document.getElementById("pluginMsg");
        if (msg) msg.textContent = t("settings.plugins.failed", String((error && error.message) || error));
      } catch {
        /* nothing left to report into */
      }
      console.error("[settings] boot failed:", error);
    });

    // Follow the theme the host resolved from the engine's appearance preference.
    const theme = new URLSearchParams(location.search).get("theme");
    if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
  </script>
</body>
</html>
