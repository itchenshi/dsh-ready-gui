<!doctype html>
<html data-theme="dark" lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>DSH Ready GUI</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 14px;
      background: #0f151d;
      border: 1px solid #2a3b4d;
      border-radius: 12px;
      color: #e6edf3;
      font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      user-select: none;
      overflow: hidden;
    }
    [data-theme="light"] body { background: #ffffff; border-color: #d0d7de; color: #1f2328; }
    .icon { font-size: 26px; color: #4d9fff; }
    .text { flex: 1; min-width: 0; }
    #t { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #s { font-size: 12px; color: #9fb3c8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 3px; }
    [data-theme="light"] #s { color: #57606a; }
    button {
      border: none;
      background: transparent;
      color: #5c6b7a;
      font-size: 16px;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 6px;
      line-height: 1;
    }
    button:hover { background: #1a2531; color: #e6edf3; }
    [data-theme="light"] button { color: #57606a; }
    [data-theme="light"] button:hover { background: #eef1f4; color: #1f2328; }
  </style>
</head>
<body>
  <div class="icon">✓</div>
  <div class="text">
    <div id="t"></div>
    <div id="s"></div>
  </div>
  <button type="button" onclick="window.close()">✕</button>
  <script>
    const params = new URLSearchParams(location.search);
    const isEn = params.get("lang") === "en";
    const theme = params.get("theme");
    if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
    document.documentElement.lang = isEn ? "en" : "zh-CN";
    // 文案一律由脚本设置：写死在 HTML 里的中文会在英文界面（或脚本没跑起来时）露出来。
    document.title = isEn ? "Update" : "更新通知";
    document.querySelector("button").title = isEn ? "Close" : "关闭";
    document.getElementById("t").textContent = isEn ? "Updated" : "已更新";

    // 右下角提示：默认 5 秒后自动关闭；鼠标悬停暂停计时，移开再计。
    const AUTO_CLOSE_MS = 5000;
    let closeTimer = null;
    // 指针可能**一开始就在**这个窗口上（提示弹在鼠标底下）：那时不会收到 mouseenter，
    // 计时器会照常把用户正在看的提示关掉。所以悬停状态要显式记着，arm() 悬停时直接不排程。
    let hovering = false;
    function arm() {
      if (hovering) return;
      clearTimeout(closeTimer);
      closeTimer = setTimeout(() => window.close(), AUTO_CLOSE_MS);
    }
    function disarm() {
      clearTimeout(closeTimer);
      closeTimer = null;
    }
    document.body.addEventListener("mouseenter", () => {
      hovering = true;
      disarm();
    });
    document.body.addEventListener("mouseleave", () => {
      hovering = false;
      arm();
    });
    // 主进程会随后写入标题/副标题；标题一旦非空即开始 5 秒计时。
    const titleEl = document.getElementById("t");
    const observer = new MutationObserver(() => {
      if (titleEl.textContent && titleEl.textContent.trim() !== "") arm();
    });
    observer.observe(titleEl, { childList: true, subtree: true, characterData: true });
    // 若 2 秒内主进程仍未写入（加载异常），同样计时关闭。
    setTimeout(() => {
      if (titleEl.textContent && titleEl.textContent.trim() !== "") arm();
    }, 2000);
  </script>
</body>
</html>
