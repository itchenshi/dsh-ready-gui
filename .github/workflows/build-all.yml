# Build DSH Ready GUI for Windows / macOS (x64 + arm64) / Linux and attach binaries
# to releases. Each GitHub-hosted runner provides the platform/arch its dist
# script needs: macOS dmg or Linux AppImage cannot be built on a Windows host
# (see README), and each macOS arch is built on a matching runner so the
# bundled portable Node matches the app arch (Intel -> x64, Apple Silicon -> arm64).
name: Build All Platforms

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Run the test suite once, before anything is built: it covers the unit tests plus
  # the checks the README advertises for CI (settings-window inline JS, bundled-plugin
  # drift, doc image references). They all run against the copies in plugins/, so no
  # plugin repository checkout is needed.
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

  build:
    name: build (${{ matrix.name }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: win-x64
            os: windows-latest
            script: dist:win
            artifact: DSH-READY-GUI-WIN
          - name: mac-arm64
            os: macos-latest
            script: dist:mac:arm64
            artifact: DSH-READY-GUI-MAC-ARM64
            node_arch: ''
          - name: mac-x64
            # Cross-built on the Apple Silicon runner (x64 node bundled via
            # DSH_NODE_ARCH); Intel-only runners are no longer reliable.
            os: macos-latest
            script: dist:mac:x64
            artifact: DSH-READY-GUI-MAC-X64
            node_arch: x64
          - name: linux-x64
            os: ubuntu-latest
            script: dist:linux
            artifact: DSH-READY-GUI-LINUX
            node_arch: ''
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Clear any stale build output (a leftover dist/ from an earlier run
      # would mix old-version artifacts like v0.1.0 exe/dmg/AppImage into a
      # newer tag's release).
      - name: Clean dist output
        shell: bash
        run: |
          if [ -d dist ]; then rm -rf dist; fi

      - name: Build (${{ matrix.script }})
        run: npm run ${{ matrix.script }}
        env:
          DSH_NODE_ARCH: ${{ matrix.node_arch }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.zip
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
          if-no-files-found: error

      - name: Attach to GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
          overwrite_files: true