# electron-builder configuration for DSH Ready GUI Shell.
# Portable Node is bundled first: `npm run bundle:node` unpacks the current
# platform's Node into resources/node, which extraResources ships with the app.
# Icons are generated from the official harness favicon by `npm run make-icons`.

appId: com.dshready.gui
productName: DSH Ready GUI
directories:
  output: dist
  buildResources: build

# The packaged app only needs src + the semver prod dependency. The dsh
# engine lives in userData/dsh-engine at runtime (installed by the app
# itself), so it is deliberately NOT packaged here.
#
# plugins/ ships the four built-in plugins inside app.asar. The GUI main process can
# read them there (Electron's fs is asar-aware) and stages real on-disk copies under
# <home>/.dsh-gui/bundled-plugins before installing them with pnpm — a child pnpm
# cannot read inside app.asar (see src/plugin-manager.js).
files:
  - src/**/*
  - package.json
  - plugins/**/*

# Do not run node-gyp rebuilds on the app's own deps (only semver, pure JS).
npmRebuild: false

# electron-builder's extraResources matcher drops node_modules, so the bundled
# portable Node is copied in full by the afterPack hook instead.
afterPack: scripts/after-pack.js

win:
  # 用 make-icons 自产的 build/icon.ico，让 electron-builder 打进 exe / 安装包。
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false

mac:
  icon: build/icon.png
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  category: public.app-category.developer-tools
  # Signing/notarization needs a certificate; leave identity empty for now.

linux:
  icon: build/icons
  target:
    - AppImage
  category: Development
  maintainer: dsh-ready-gui