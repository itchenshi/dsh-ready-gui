# dsh-model-surplus layer.
#
# The row `id` stays `model-usage` on purpose: it is the identity the profile's
# patch layer and the marketplace state.json have recorded for the user's
# enable/disable choice, and it is independent of the package name. Renaming the
# package must not orphan that choice.
#
# Shows model usage / account balance in the session header, gated on the
# session's ACTIVE model selection:
#   - OpenCode Go models  -> plan usage (rolling / weekly / monthly percentages)
#   - DeepSeek models     -> account balance (total / granted / topped-up)
#
# Why a plugin: both are per-account data that must be fetched server-side (the
# API keys must never reach the browser), and the display belongs next to the
# session title. Both are exactly what a host half + client half pair is for.
#
# Every section is optional and independently configured: a user with only one
# of the two keys still gets that half, and the other half degrades to a
# diagnostic label instead of hiding the widget.
#
# Configuration (row `config`, all optional):
#   enabled: true|false          master switch. Default true.
#
#   opencodeGo:
#     baseUrl: string            upstream base. Default https://opencode.ai/zen/go/v1
#     apiKeyRef: string          credential REFERENCE (env-var name).
#                                Default OPENCODE_GO_API_KEY.
#     providers: [string]        provider route keys that count as "OpenCode Go".
#                                Default [opencode-go, opencode].
#
#   deepseek:
#     baseUrl: string            upstream base. Default https://api.deepseek.com
#     apiKeyRef: string          credential REFERENCE (env-var name).
#                                Default DEEPSEEK_API_KEY.
#     providers: [string]        provider route keys that count as "DeepSeek".
#                                Default [deepseek-official] (the route the
#                                engine's dsh-llm-deepseek adapter registers).
#
# Legacy shorthand: a top-level `baseUrl` / `apiKeyRef` / `providers` is still
# read as the opencodeGo section (the plugin used to be OpenCode-Go-only).
- insert:
    - id: model-usage
      name: dsh-model-surplus
      config:
        enabled: true
        opencodeGo:
          providers:
            - opencode-go
            - opencode
        deepseek:
          providers:
            - deepseek-official
