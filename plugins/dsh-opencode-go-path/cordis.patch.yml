# dsh-opencode-go-path layer.
#
# One plugin for the OpenCode / OpenCode Go routes, three jobs:
#
#   1. Declare the wire protocol for the `opencode-go` route (the `llm-pi-ai`
#      patch below). The engine resolves each route's models with
#        api = route.api ?? catalogModel.api ?? sharedCatalogApi(route)
#      opencode-go's catalog spans anthropic-messages / openai-completions /
#      openai-responses, so the shared fallback is undefined; catalog-unknown
#      models (e.g. deepseek-v4.1-flash, which upstream already serves) then
#      need the route-level `api`. OpenCode Go speaks OpenAI-compatible
#      protocol at https://opencode.ai/zen/go/v1, so `openai-completions` is
#      correct (the same choice the user settings document makes for
#      bailian-tpp).
#
#   2. Mount this plugin's host half (lib/index.js), which DETECTS the route's
#      models from the engine's own catalog and puts the DeepSeek V4.1 models at
#      the FRONT of the route's models list — seeding that list from the detected
#      catalog when the user configured none, and declaring the route's baseURL
#      when a listed model is not in the catalog (the only way the engine will
#      serve one).
#
#      Why that baseURL matters: a catalog-unknown model resolves its endpoint as
#        baseURL = route.baseURL ?? catalogModel.baseUrl ?? providerBaseUrl
#      and the installed opencode-go catalog provider has no provider-level
#      baseUrl, so such a model has nowhere to point — the engine then refuses
#      both to serve it ("needs a baseURL") and to STORE it, which is why the
#      model never reached the picker. The runtime half supplies the endpoint only
#      when the route has none, so a route the user pointed elsewhere keeps its own.
#
#      Those entries also carry the DeepSeek wire quirks the catalog would
#      otherwise supply (`compat` + `reasoningEfforts`): pi-ai auto-detects them
#      from the provider name or host, and the OpenCode Go relay is neither, so
#      without them the replayed assistant turns omit `reasoning_content` and
#      DeepSeek answers 400 "The reasoning_content in the thinking mode must be
#      passed back to the API" on every multi-turn call.
#
#   3. Attach `x-opencode-session` to model requests routed to an OpenCode /
#      OpenCode Go provider profile (see the row config below).
#
# Row config (all optional):
#   providers: [string]  provider route keys to attach the header to.
#                        Defaults to the pi-ai catalog ids ['opencode', 'opencode-go'].
#                        Add your own route key when the OpenCode endpoint is
#                        served under a custom provider name.
#   mode: 'uuid' | 'session-id'   header value derivation.
#                        'uuid' (secure DEFAULT): a random opaque UUID per DSH
#                        session — the internal DSH session id is NEVER sent to
#                        third parties.
#                        'session-id': opt-in only; reuses the DSH session id
#                        (the same identity the official adapter sends as
#                        x-deepseek-harness-session-id). Only choose this if you
#                        fully trust the OpenCode upstream with your internal id.
#   debug: true|false    log every streamed call that receives the header.
#   debugFile: path      optional: append one JSON line per streamed call to the
#                        given file. ONLY a path under $DSH_HOME/logs or the OS
#                        temp dir is honored; anything else is ignored. The
#                        logged "session" field is a one-way SHA-256 hash (redacted),
#                        never the raw DSH session id.
#
# The `llm-pi-ai` entry below patches an existing engine row (mounted by
# @deepseek-ai/dsh-base) rather than inserting a new one — cordis merges patch
# layers by row id, so this layer supplies the missing `api` without touching
# the rest. It is deliberately NOT under `insert`, so the settings window's
# enable/disable writes (which target the inserted row ids only) can never
# disable the protocol declaration and break catalog-unknown models.
- insert:
    - id: opencode-go
      name: dsh-opencode-go-path
      config:
        providers:
          - opencode
          - opencode-go
        mode: uuid
        debug: false
- id: llm-pi-ai
  config:
    providers:
      opencode-go:
        api: openai-completions